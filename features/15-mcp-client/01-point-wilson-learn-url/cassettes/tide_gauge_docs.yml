        Requires Visual Studio\\n## Overview\\nThis article describes how to use the
        [Azure IoT SDK for .NET](https://github.com/Azure/azure-iot-sdk-csharp/blob/main/readme.md)
        to create device and backend service application code for device twins.\",\"contentUrl\":\"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins\"},{\"title\":\"Get
        started with device twins (programming-language-node)\",\"content\":\"# Get
