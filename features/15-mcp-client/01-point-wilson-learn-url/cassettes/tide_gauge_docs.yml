        data: {"result":{"content":[{"type":"text","text":"{\u0022results\u0022:[{\u0022title\u0022:\u0022Understand and use device twins in IoT Hub\u0022,\u0022content\u0022:\u0022# Understand and use device twins in IoT Hub\\n*Device twins* are JSON documents that store device state information including metadata, configurations, and conditions. Azure IoT Hub maintains a device twin for each device that you connect to IoT Hub.\\nNote\\nThe features described in this article are available only in the standard tier of IoT Hub. For more information about the basic and standard/free IoT Hub tiers, see [Choose the right IoT Hub tier and size for your solution](https://learn.microsoft.com/azure/iot-hub/iot-hub-scaling).\\nThis article describes:\\n1. The structure of the device twin: *tags*, *desired properties*, and *reported properties*.\\n2. The operations that [*device applications*](https://learn.microsoft.com/azure/iot/iot-glossary#device-app) and the [*solution back end*](https://learn.microsoft.com/azure/iot/iot-glossary#solution-back-end) can perform on device twins.\\nUse device twins to:\\n1. Store device-specific metadata in the cloud. For example, the location of a vending machine.\\n2. Report current state information such as available capabilities and conditions from your device app. For example, whether a device is connected to your IoT hub over cellular or WiFi.\\n3. Synchronize the state of long-running workflows between device app and back-end apps. For example, when a back-end app specifies the new firmware version to install, and the device app reports the various stages of the update process.\\n4. Query your device metadata, configuration, or state.\\nFor more information about using reported properties, device-to-cloud messages, or file upload, see [Device-to-cloud communication guidance](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-d2c-guidance).\\nFor more information about using desired properties, direct methods, or cloud-to-device messages, see [Cloud-to-device communication guidance](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-c2d-guidance).\\nTo learn how device twins relate to the device model used by an Azure IoT Plug and Play device, see [Understand IoT Plug and Play digital twins](https://learn.microsoft.com/en-us/previous-versions/azure/iot/concepts-digital-twin).\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-device-twins\u0022},{\u0022title\u0022:\u0022Get started with device twins (programming-language-java)\u0022,\u0022content\u0022:\u0022# Get started with device twins (programming-language-java)\\nUse the Azure IoT Hub device SDK and service SDK to develop applications that handle common device twin tasks. Device twins are JSON documents that store device state information including metadata, configurations, and conditions. IoT Hub persists a device twin for each device that connects to it.\\nYou can use device twins to:\\n1. Store device metadata from your solution back end\\n2. Report current state information such as available capabilities and conditions, for example, the connectivity method used, from your device app\\n3. Synchronize the state of long-running workflows, such as firmware and configuration updates, between a device app and a back-end app\\n4. Query your device metadata, configuration, or state\\nFor more information about device twins, including when to use device twins, see [Understand and use device twins in IoT Hub](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-device-twins).\\nNote\\nThe features described in this article are available only in the standard tier of IoT Hub. For more information about the basic and standard/free IoT Hub tiers, see [Choose the right IoT Hub tier and size for your solution](https://learn.microsoft.com/azure/iot-hub/iot-hub-scaling).\\nThis article shows you how to develop two types of applications:\\n1. Device apps can handle requests to update desired properties and respond with changes to reported properties.\\n2. Service apps can update device twin tags, set new desired properties, and query devices based on device twin values.\\nNote\\nThis article is meant to complement [Azure IoT SDKs](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-sdks) samples that are referenced from within this article. You can use SDK tools to build both device and back-end applications.\\n## Prerequisites\\n1. An IoT hub\\n2. A registered device\\n3. If your application uses the MQTT protocol, make sure that port 8883 is open in your firewall. The MQTT protocol communicates over port 8883. This port may be blocked in some corporate and educational network environments. For more information and ways to work around this issue, see [Connecting to IoT Hub (MQTT)](https://learn.microsoft.com/azure/iot-hub/iot-mqtt-connect-to-iot-hub#connect-to-iot-hub).\\n4. Requires [Java SE Development Kit 8](https://learn.microsoft.com/en-us/azure/developer/java/fundamentals/). Make sure you select **Java 8** under **Long-term support** to navigate to downloads for JDK 8.\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/iot-hub/how-to-device-twins\u0022},{\u0022title\u0022:\u0022Get started with device twins (programming-language-csharp)\u0022,\u0022content\u0022:\u0022# Get started with device twins (programming-language-csharp)\\nUse the Azure IoT Hub device SDK and service SDK to develop applications that handle common device twin tasks. Device twins are JSON documents that store device state information including metadata, configurations, and conditions. IoT Hub persists a device twin for each device that connects to it.\\nYou can use device twins to:\\n1. Store device metadata from your solution back end\\n2. Report current state information such as available capabilities and conditions, for example, the connectivity method used, from your device app\\n3. Synchronize the state of long-running workflows, such as firmware and configuration updates, between a device app and a back-end app\\n4. Query your device metadata, configuration, or state\\nFor more information about device twins, including when to use device twins, see [Understand and use device twins in IoT Hub](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-device-twins).\\nNote\\nThe features described in this article are available only in the standard tier of IoT Hub. For more information about the basic and standard/free IoT Hub tiers, see [Choose the right IoT Hub tier and size for your solution](https://learn.microsoft.com/azure/iot-hub/iot-hub-scaling).\\nThis article shows you how to develop two types of applications:\\n1. Device apps can handle requests to update desired properties and respond with changes to reported properties.\\n2. Service apps can update device twin tags, set new desired properties, and query devices based on device twin values.\\nNote\\nThis article is meant to complement [Azure IoT SDKs](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-sdks) samples that are referenced from within this article. You can use SDK tools to build both device and back-end applications.\\n## Prerequisites\\n1. An IoT hub\\n2. A registered device\\n3. If your application uses the MQTT protocol, make sure that port 8883 is open in your firewall. The MQTT protocol communicates over port 8883. This port may be blocked in some corporate and educational network environments. For more information and ways to work around this issue, see [Connecting to IoT Hub (MQTT)](https://learn.microsoft.com/azure/iot-hub/iot-mqtt-connect-to-iot-hub#connect-to-iot-hub).\\n4. Requires Visual Studio\\n## Overview\\nThis article describes how to use the [Azure IoT SDK for .NET](https://github.com/Azure/azure-iot-sdk-csharp/blob/main/readme.md) to create device and backend service application code for device twins.\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/iot-hub/how-to-device-twins\u0022},{\u0022title\u0022:\u0022Get started with device twins (programming-language-node)\u0022,\u0022content\u0022:\u0022# Get started with device twins (programming-language-node)\\nUse the Azure IoT Hub device SDK and service SDK to develop applications that handle common device twin tasks. Device twins are JSON documents that store device state information including metadata, configurations, and conditions. IoT Hub persists a device twin for each device that connects to it.\\nYou can use device twins to:\\n1. Store device metadata from your solution back end\\n2. Report current state information such as available capabilities and conditions, for example, the connectivity method used, from your device app\\n3. Synchronize the state of long-running workflows, such as firmware and configuration updates, between a device app and a back-end app\\n4. Query your device metadata, configuration, or state\\nFor more information about device twins, including when to use device twins, see [Understand and use device twins in IoT Hub](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-device-twins).\\nNote\\nThe features described in this article are available only in the standard tier of IoT Hub. For more information about the basic and standard/free IoT Hub tiers, see [Choose the right IoT Hub tier and size for your solution](https://learn.microsoft.com/azure/iot-hub/iot-hub-scaling).\\nThis article shows you how to develop two types of applications:\\n1. Device apps can handle requests to update desired properties and respond with changes to reported properties.\\n2. Service apps can update device twin tags, set new desired properties, and query devices based on device twin values.\\nNote\\nThis article is meant to complement [Azure IoT SDKs](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-sdks) samples that are referenced from within this article. You can use SDK tools to build both device and back-end applications.\\n## Prerequisites\\n1. An IoT hub\\n2. A registered device\\n3. If your application uses the MQTT protocol, make sure that port 8883 is open in your firewall. The MQTT protocol communicates over port 8883. This port may be blocked in some corporate and educational network environments. For more information and ways to work around this issue, see [Connecting to IoT Hub (MQTT)](https://learn.microsoft.com/azure/iot-hub/iot-mqtt-connect-to-iot-hub#connect-to-iot-hub).\\n4. Requires Node.js version 10.0.x or later\\n## Overview\\nThis article describes how to use the [Azure IoT SDK for Node.js](https://github.com/Azure/azure-iot-sdk-node) to create device and backend service application code for device twins.\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/iot-hub/how-to-device-twins\u0022},{\u0022title\u0022:\u0022Get started with device twins (programming-language-python)\u0022,\u0022content\u0022:\u0022# Get started with device twins (programming-language-python)\\nUse the Azure IoT Hub device SDK and service SDK to develop applications that handle common device twin tasks. Device twins are JSON documents that store device state information including metadata, configurations, and conditions. IoT Hub persists a device twin for each device that connects to it.\\nYou can use device twins to:\\n1. Store device metadata from your solution back end\\n2. Report current state information such as available capabilities and conditions, for example, the connectivity method used, from your device app\\n3. Synchronize the state of long-running workflows, such as firmware and configuration updates, between a device app and a back-end app\\n4. Query your device metadata, configuration, or state\\nFor more information about device twins, including when to use device twins, see [Understand and use device twins in IoT Hub](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-device-twins).\\nNote\\nThe features described in this article are available only in the standard tier of IoT Hub. For more information about the basic and standard/free IoT Hub tiers, see [Choose the right IoT Hub tier and size for your solution](https://learn.microsoft.com/azure/iot-hub/iot-hub-scaling).\\nThis article shows you how to develop two types of applications:\\n1. Device apps can handle requests to update desired properties and respond with changes to reported properties.\\n2. Service apps can update device twin tags, set new desired properties, and query devices based on device twin values.\\nNote\\nThis article is meant to complement [Azure IoT SDKs](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-sdks) samples that are referenced from within this article. You can use SDK tools to build both device and back-end applications.\\n## Prerequisites\\n1. An IoT hub\\n2. A registered device\\n3. If your application uses the MQTT protocol, make sure that port 8883 is open in your firewall. The MQTT protocol communicates over port 8883. This port may be blocked in some corporate and educational network environments. For more information and ways to work around this issue, see [Connecting to IoT Hub (MQTT)](https://learn.microsoft.com/azure/iot-hub/iot-mqtt-connect-to-iot-hub#connect-to-iot-hub).\\n4. Python SDK - [Python version 3.7 or later](https://www.python.org/downloads/) is recommended. Make sure to use the 32-bit or 64-bit installation as required by your setup. When prompted during the installation, make sure to add Python to your platform-specific environment variable.\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/iot-hub/how-to-device-twins\u0022},{\u0022title\u0022:\u0022Get started with device twins (programming-language-csharp)\u0022,\u0022content\u0022:\u0022# Get started with device twins (programming-language-csharp)\\n## Create a backend application\\nA backend application connects to a device through IoT Hub and can read device reported and desired properties, write device desired properties, and run device queries.\\nThis section describes how to create backend application code to:\\n1. Read and update device twin fields\\n2. Create a device twin query\\nThe [RegistryManager](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.registrymanager) class exposes all methods required to create a backend application to interact with device twins from the service.\\n### Add service NuGet Package\\nBackend service applications require the **Microsoft.Azure.Devices** NuGet package.\\n### Connect to IoT hub\\nYou can connect a backend service to IoT Hub using the following methods:\\n1. Shared access policy\\n2. Microsoft Entra\\nImportant\\nThis article includes steps to connect to a service using a shared access signature. This authentication method is convenient for testing and evaluation, but authenticating to a service with Microsoft Entra ID or managed identities is a more secure approach. To learn more, see [Security best practices for IoT solutions \\u003E Cloud security](https://learn.microsoft.com/azure/iot/iot-overview-security#cloud-security).\\n#### Connect using a shared access policy\\nConnect a backend application to a device using [CreateFromConnectionString](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.registrymanager.createfromconnectionstring). Your application needs the **service connect** permission to modify desired properties of a device twin, and it needs **registry read** permission to query the identity registry. There is no default shared access policy that contains only these two permissions, so you need to create one if a one does not already exist. Supply this shared access policy connection string as a parameter to \\u0060fromConnectionString\\u0060. For more information about shared access policies, see [Control access to IoT Hub with shared access signatures](https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-sas).\\n\\u0060\\u0060\\u0060csharp\\nusing Microsoft.Azure.Devices;\\nstatic RegistryManager registryManager;\\nstatic string connectionString = \\u0022{Shared access policy connection string}\\u0022;\\nregistryManager = RegistryManager.CreateFromConnectionString(connectionString);\\n\\u0060\\u0060\\u0060\\n#### Connect using Microsoft Entra\\nA backend app that uses Microsoft Entra must successfully authenticate and obtain a security token credential before connecting to IoT Hub. This token is passed to a IoT Hub connection method. For general information about setting up and using Microsoft Entra for IoT Hub, see [Control access to IoT Hub by using Microsoft Entra ID](https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-azure-ad).\\n##### Configure Microsoft Entra app\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-backend-application\u0022},{\u0022title\u0022:\u0022Get started with device twins (programming-language-node)\u0022,\u0022content\u0022:\u0022# Get started with device twins (programming-language-node)\\n## Create a device application\\nDevice applications can read and write twin reported properties, and be notified of desired twin property changes that are set by a backend application or IoT Hub.\\nThis section describes how to use the [azure-iot-device](https://learn.microsoft.com/en-us/javascript/api/azure-iot-device) package in the Azure IoT SDK for Node.js to create a device application to:\\n1. Retrieve a device twin and examine reported properties\\n2. Update reported device twin properties\\n3. Receive notice of desired property changes\\nImportant\\nThis article includes steps to connect a device using a shared access signature, also called symmetric key authentication. This authentication method is convenient for testing and evaluation, but authenticating a device using X.509 certificates is a more secure approach. To learn more, see [Security best practices for IoT solutions \\u003E Connection security](https://learn.microsoft.com/azure/iot/iot-overview-security#connection-security).\\n### Install device SDK package\\nRun this command to install the **azure-iot-device** device SDK on your development machine:\\n\\u0060\\u0060\\u0060cmd\\nnpm install azure-iot-device --save\\n\\u0060\\u0060\\u0060\\n### Connect a device to IoT Hub\\nA device app can authenticate with IoT Hub using the following methods:\\n1. X.509 certificate\\n2. Shared access key\\nImportant\\nThis article includes steps to connect a device using a shared access signature, also called symmetric key authentication. This authentication method is convenient for testing and evaluation, but authenticating a device using X.509 certificates is a more secure approach. To learn more, see [Security best practices for IoT solutions \\u003E Connection security](https://learn.microsoft.com/azure/iot/iot-overview-security#connection-security).\\n#### Authenticate using an X.509 certificate\\nThe X.509 certificate is attached to the device-to-IoT Hub connection transport.\\nTo configure a device-to-IoT Hub connection using an X.509 certificate:\\n1. Call [fromConnectionString](https://learn.microsoft.com/en-us/javascript/api/azure-iothub/client?#azure-iothub-client-fromconnectionstring) to add the device or identity module connection string, and transport type to the \\u0060Client\\u0060 object. Add \\u0060x509=true\\u0060 to the connection string to indicate that a certificate is added to \\u0060DeviceClientOptions\\u0060. For example:\\n1.1. A **device** connection string:\\n  \\u0060HostName=xxxxx.azure-devices.net;DeviceId=Device-1;SharedAccessKey=xxxxxxxxxxxxx;x509=true\\u0060\\n1.2. An **identity module** connection string:\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-device-application\u0022},{\u0022title\u0022:\u0022Get started with device twins (programming-language-node)\u0022,\u0022content\u0022:\u0022# Get started with device twins (programming-language-node)\\n## Create a backend application\\nA backend application connects to a device through IoT Hub and can read device reported and desired properties, write device desired properties, and run device queries.\\nThis section describes how to create a backend application that:\\n1. Retrieves and updates a device twin\\n2. Creates a device twin query\\n### Install service SDK package\\nRun this command to install **azure-iothub** on your development machine:\\n\\u0060\\u0060\\u0060cmd\\nnpm install azure-iothub --save\\n\\u0060\\u0060\\u0060\\nThe [Registry](https://learn.microsoft.com/en-us/javascript/api/azure-iothub/registry) class exposes all methods required to interact with device twins from a backend application.\\n### Connect to IoT hub\\nYou can connect a backend service to IoT Hub using the following methods:\\n1. Shared access policy\\n2. Microsoft Entra\\nImportant\\nThis article includes steps to connect to a service using a shared access signature. This authentication method is convenient for testing and evaluation, but authenticating to a service with Microsoft Entra ID or managed identities is a more secure approach. To learn more, see [Security best practices for IoT solutions \\u003E Cloud security](https://learn.microsoft.com/azure/iot/iot-overview-security#cloud-security).\\n#### Connect using a shared access policy\\nUse [fromConnectionString](https://learn.microsoft.com/en-us/javascript/api/azure-iothub/registry?#azure-iothub-registry-fromconnectionstring) to connect to IoT hub. Your application needs the **service connect** permission to modify desired properties of a device twin, and it needs **registry read** permission to query the identity registry. There is no default shared access policy that contains only these two permissions, so you need to create one if a one does not already exist. Supply this shared access policy connection string as a parameter to \\u0060fromConnectionString\\u0060. For more information about shared access policies, see [Control access to IoT Hub with shared access signatures](https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-sas).\\n\\u0060\\u0060\\u0060javascript\\n\\u0027use strict\\u0027;\\nvar iothub = require(\\u0027azure-iothub\\u0027);\\nvar connectionString = \\u0027{Shared access policy connection string}\\u0027;\\nvar registry = iothub.Registry.fromConnectionString(connectionString);\\n\\u0060\\u0060\\u0060\\n#### Connect using Microsoft Entra\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-backend-application\u0022},{\u0022title\u0022:\u0022Get started with device twins (programming-language-python)\u0022,\u0022content\u0022:\u0022# Get started with device twins (programming-language-python)\\n## Create a backend application\\nA backend application connects to a device through IoT Hub and can read device reported and desired properties, write device desired properties, and run device queries.\\nThis section describes how to create a backend application to:\\n1. Update twin tags and desired properties\\n2. Queries devices using filters on the tags and properties\\nThe [IoTHubRegistryManager](https://learn.microsoft.com/en-us/python/api/azure-iot-hub/azure.iot.hub.iothubregistrymanager) class exposes all methods required to create a backend application to interact with device twins from the service.\\n### Connect to IoT hub\\nYou can connect a backend service to IoT Hub using the following methods:\\n1. Shared access policy\\n2. Microsoft Entra\\nImportant\\nThis article includes steps to connect to a service using a shared access signature. This authentication method is convenient for testing and evaluation, but authenticating to a service with Microsoft Entra ID or managed identities is a more secure approach. To learn more, see [Security best practices for IoT solutions \\u003E Cloud security](https://learn.microsoft.com/azure/iot/iot-overview-security#cloud-security).\\n#### Connect using a shared access policy\\nConnect to IoT hub using [from_connection_string](https://learn.microsoft.com/en-us/python/api/azure-iot-hub/azure.iot.hub.iothubregistrymanager?#azure-iot-hub-iothubregistrymanager-from-connection-string). Your application needs the **service connect** permission to modify desired properties of a device twin, and it needs **registry read** permission to query the identity registry. There is no default shared access policy that contains only these two permissions, so you need to create one if a one does not already exist. Supply this shared access policy connection string as a parameter to \\u0060fromConnectionString\\u0060. For more information about shared access policies, see [Control access to IoT Hub with shared access signatures](https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-sas).\\nFor example:\\n\\u0060\\u0060\\u0060python\\nimport sys\\nfrom time import sleep\\nfrom azure.iot.hub import IoTHubRegistryManager\\nfrom azure.iot.hub.models import Twin, TwinProperties, QuerySpecification, QueryResult\\n\\n# Connect to IoT hub\\nIOTHUB_CONNECTION_STRING = \\u0022{IoT hub service connection string}\\u0022\\niothub_registry_manager = IoTHubRegistryManager.from_connection_string(IOTHUB_CONNECTION_STRING)\\n\\u0060\\u0060\\u0060\\n#### Connect using Microsoft Entra\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-backend-application\u0022},{\u0022title\u0022:\u0022Get started with device twins (programming-language-csharp)\u0022,\u0022content\u0022:\u0022# Get started with device twins (programming-language-csharp)\\n## Create a device application\\nDevice applications can read and write twin reported properties, and be notified of desired twin property changes that are set by a backend application or IoT Hub.\\nThis section describes how to use device application code to:\\n1. Retrieve a device twin and examine reported properties\\n2. Update reported device twin properties\\n3. Create a desired property update callback handler\\n### Required device NuGet package\\nDevice client applications written in C# require the **Microsoft.Azure.Devices.Client** NuGet package.\\nAdd this \\u0060using\\u0060 statement to use the device library.\\n\\u0060\\u0060\\u0060csharp\\nusing Microsoft.Azure.Devices.Client;\\n\\u0060\\u0060\\u0060\\n### Connect a device to IoT Hub\\nA device app can authenticate with IoT Hub using the following methods:\\n1. Shared access key\\n2. X.509 certificate\\nImportant\\nThis article includes steps to connect a device using a shared access signature, also called symmetric key authentication. This authentication method is convenient for testing and evaluation, but authenticating a device using X.509 certificates is a more secure approach. To learn more, see [Security best practices for IoT solutions \\u003E Connection security](https://learn.microsoft.com/azure/iot/iot-overview-security#connection-security).\\n#### Authenticate using a shared access key\\nThe [DeviceClient](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.client.deviceclient) class exposes all the methods required to interact with device twins from the device.\\nConnect to the device using the [CreateFromConnectionString](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.client.deviceclient.createfromconnectionstring?#microsoft-azure-devices-client-deviceclient-createfromconnectionstring%28system-string-microsoft-azure-devices-client-transporttype%29) method along with device connection string and the connection transport protocol.\\nThe \\u0060CreateFromConnectionString\\u0060[TransportType](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.client.transporttype) transport protocol parameter supports the following transport protocols:\\n1. \\u0060Mqtt\\u0060\\n2. \\u0060Mqtt_WebSocket_Only\\u0060\\n3. \\u0060Mqtt_Tcp_Only\\u0060\\n4. \\u0060Amqp\\u0060\\n5. \\u0060Amqp_WebSocket_Only\\u0060\\n6. \\u0060Amqp_Tcp_Only\\u0060\\nThe \\u0060Http1\\u0060 protocol is not supported for device twin updates.\\nThis example connects to a device using the \\u0060Mqtt\\u0060 transport protocol.\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-device-application\u0022}]}"}],"structuredContent":{"results":[{"title":"Understand and use device twins in IoT Hub","content":"# Understand and use device twins in IoT Hub\n*Device twins* are JSON documents that store device state information including metadata, configurations, and conditions. Azure IoT Hub maintains a device twin for each device that you connect to IoT Hub.\nNote\nThe features described in this article are available only in the standard tier of IoT Hub. For more information about the basic and standard/free IoT Hub tiers, see [Choose the right IoT Hub tier and size for your solution](https://learn.microsoft.com/azure/iot-hub/iot-hub-scaling).\nThis article describes:\n1. The structure of the device twin: *tags*, *desired properties*, and *reported properties*.\n2. The operations that [*device applications*](https://learn.microsoft.com/azure/iot/iot-glossary#device-app) and the [*solution back end*](https://learn.microsoft.com/azure/iot/iot-glossary#solution-back-end) can perform on device twins.\nUse device twins to:\n1. Store device-specific metadata in the cloud. For example, the location of a vending machine.\n2. Report current state information such as available capabilities and conditions from your device app. For example, whether a device is connected to your IoT hub over cellular or WiFi.\n3. Synchronize the state of long-running workflows between device app and back-end apps. For example, when a back-end app specifies the new firmware version to install, and the device app reports the various stages of the update process.\n4. Query your device metadata, configuration, or state.\nFor more information about using reported properties, device-to-cloud messages, or file upload, see [Device-to-cloud communication guidance](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-d2c-guidance).\nFor more information about using desired properties, direct methods, or cloud-to-device messages, see [Cloud-to-device communication guidance](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-c2d-guidance).\nTo learn how device twins relate to the device model used by an Azure IoT Plug and Play device, see [Understand IoT Plug and Play digital twins](https://learn.microsoft.com/en-us/previous-versions/azure/iot/concepts-digital-twin).","contentUrl":"https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-device-twins"},{"title":"Get started with device twins (programming-language-java)","content":"# Get started with device twins (programming-language-java)\nUse the Azure IoT Hub device SDK and service SDK to develop applications that handle common device twin tasks. Device twins are JSON documents that store device state information including metadata, configurations, and conditions. IoT Hub persists a device twin for each device that connects to it.\nYou can use device twins to:\n1. Store device metadata from your solution back end\n2. Report current state information such as available capabilities and conditions, for example, the connectivity method used, from your device app\n3. Synchronize the state of long-running workflows, such as firmware and configuration updates, between a device app and a back-end app\n4. Query your device metadata, configuration, or state\nFor more information about device twins, including when to use device twins, see [Understand and use device twins in IoT Hub](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-device-twins).\nNote\nThe features described in this article are available only in the standard tier of IoT Hub. For more information about the basic and standard/free IoT Hub tiers, see [Choose the right IoT Hub tier and size for your solution](https://learn.microsoft.com/azure/iot-hub/iot-hub-scaling).\nThis article shows you how to develop two types of applications:\n1. Device apps can handle requests to update desired properties and respond with changes to reported properties.\n2. Service apps can update device twin tags, set new desired properties, and query devices based on device twin values.\nNote\nThis article is meant to complement [Azure IoT SDKs](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-sdks) samples that are referenced from within this article. You can use SDK tools to build both device and back-end applications.\n## Prerequisites\n1. An IoT hub\n2. A registered device\n3. If your application uses the MQTT protocol, make sure that port 8883 is open in your firewall. The MQTT protocol communicates over port 8883. This port may be blocked in some corporate and educational network environments. For more information and ways to work around this issue, see [Connecting to IoT Hub (MQTT)](https://learn.microsoft.com/azure/iot-hub/iot-mqtt-connect-to-iot-hub#connect-to-iot-hub).\n4. Requires [Java SE Development Kit 8](https://learn.microsoft.com/en-us/azure/developer/java/fundamentals/). Make sure you select **Java 8** under **Long-term support** to navigate to downloads for JDK 8.","contentUrl":"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins"},{"title":"Get started with device twins (programming-language-csharp)","content":"# Get started with device twins (programming-language-csharp)\nUse the Azure IoT Hub device SDK and service SDK to develop applications that handle common device twin tasks. Device twins are JSON documents that store device state information including metadata, configurations, and conditions. IoT Hub persists a device twin for each device that connects to it.\nYou can use device twins to:\n1. Store device metadata from your solution back end\n2. Report current state information such as available capabilities and conditions, for example, the connectivity method used, from your device app\n3. Synchronize the state of long-running workflows, such as firmware and configuration updates, between a device app and a back-end app\n4. Query your device metadata, configuration, or state\nFor more information about device twins, including when to use device twins, see [Understand and use device twins in IoT Hub](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-device-twins).\nNote\nThe features described in this article are available only in the standard tier of IoT Hub. For more information about the basic and standard/free IoT Hub tiers, see [Choose the right IoT Hub tier and size for your solution](https://learn.microsoft.com/azure/iot-hub/iot-hub-scaling).\nThis article shows you how to develop two types of applications:\n1. Device apps can handle requests to update desired properties and respond with changes to reported properties.\n2. Service apps can update device twin tags, set new desired properties, and query devices based on device twin values.\nNote\nThis article is meant to complement [Azure IoT SDKs](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-sdks) samples that are referenced from within this article. You can use SDK tools to build both device and back-end applications.\n## Prerequisites\n1. An IoT hub\n2. A registered device\n3. If your application uses the MQTT protocol, make sure that port 8883 is open in your firewall. The MQTT protocol communicates over port 8883. This port may be blocked in some corporate and educational network environments. For more information and ways to work around this issue, see [Connecting to IoT Hub (MQTT)](https://learn.microsoft.com/azure/iot-hub/iot-mqtt-connect-to-iot-hub#connect-to-iot-hub).\n4. Requires Visual Studio\n## Overview\nThis article describes how to use the [Azure IoT SDK for .NET](https://github.com/Azure/azure-iot-sdk-csharp/blob/main/readme.md) to create device and backend service application code for device twins.","contentUrl":"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins"},{"title":"Get started with device twins (programming-language-node)","content":"# Get started with device twins (programming-language-node)\nUse the Azure IoT Hub device SDK and service SDK to develop applications that handle common device twin tasks. Device twins are JSON documents that store device state information including metadata, configurations, and conditions. IoT Hub persists a device twin for each device that connects to it.\nYou can use device twins to:\n1. Store device metadata from your solution back end\n2. Report current state information such as available capabilities and conditions, for example, the connectivity method used, from your device app\n3. Synchronize the state of long-running workflows, such as firmware and configuration updates, between a device app and a back-end app\n4. Query your device metadata, configuration, or state\nFor more information about device twins, including when to use device twins, see [Understand and use device twins in IoT Hub](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-device-twins).\nNote\nThe features described in this article are available only in the standard tier of IoT Hub. For more information about the basic and standard/free IoT Hub tiers, see [Choose the right IoT Hub tier and size for your solution](https://learn.microsoft.com/azure/iot-hub/iot-hub-scaling).\nThis article shows you how to develop two types of applications:\n1. Device apps can handle requests to update desired properties and respond with changes to reported properties.\n2. Service apps can update device twin tags, set new desired properties, and query devices based on device twin values.\nNote\nThis article is meant to complement [Azure IoT SDKs](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-sdks) samples that are referenced from within this article. You can use SDK tools to build both device and back-end applications.\n## Prerequisites\n1. An IoT hub\n2. A registered device\n3. If your application uses the MQTT protocol, make sure that port 8883 is open in your firewall. The MQTT protocol communicates over port 8883. This port may be blocked in some corporate and educational network environments. For more information and ways to work around this issue, see [Connecting to IoT Hub (MQTT)](https://learn.microsoft.com/azure/iot-hub/iot-mqtt-connect-to-iot-hub#connect-to-iot-hub).\n4. Requires Node.js version 10.0.x or later\n## Overview\nThis article describes how to use the [Azure IoT SDK for Node.js](https://github.com/Azure/azure-iot-sdk-node) to create device and backend service application code for device twins.","contentUrl":"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins"},{"title":"Get started with device twins (programming-language-python)","content":"# Get started with device twins (programming-language-python)\nUse the Azure IoT Hub device SDK and service SDK to develop applications that handle common device twin tasks. Device twins are JSON documents that store device state information including metadata, configurations, and conditions. IoT Hub persists a device twin for each device that connects to it.\nYou can use device twins to:\n1. Store device metadata from your solution back end\n2. Report current state information such as available capabilities and conditions, for example, the connectivity method used, from your device app\n3. Synchronize the state of long-running workflows, such as firmware and configuration updates, between a device app and a back-end app\n4. Query your device metadata, configuration, or state\nFor more information about device twins, including when to use device twins, see [Understand and use device twins in IoT Hub](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-device-twins).\nNote\nThe features described in this article are available only in the standard tier of IoT Hub. For more information about the basic and standard/free IoT Hub tiers, see [Choose the right IoT Hub tier and size for your solution](https://learn.microsoft.com/azure/iot-hub/iot-hub-scaling).\nThis article shows you how to develop two types of applications:\n1. Device apps can handle requests to update desired properties and respond with changes to reported properties.\n2. Service apps can update device twin tags, set new desired properties, and query devices based on device twin values.\nNote\nThis article is meant to complement [Azure IoT SDKs](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-sdks) samples that are referenced from within this article. You can use SDK tools to build both device and back-end applications.\n## Prerequisites\n1. An IoT hub\n2. A registered device\n3. If your application uses the MQTT protocol, make sure that port 8883 is open in your firewall. The MQTT protocol communicates over port 8883. This port may be blocked in some corporate and educational network environments. For more information and ways to work around this issue, see [Connecting to IoT Hub (MQTT)](https://learn.microsoft.com/azure/iot-hub/iot-mqtt-connect-to-iot-hub#connect-to-iot-hub).\n4. Python SDK - [Python version 3.7 or later](https://www.python.org/downloads/) is recommended. Make sure to use the 32-bit or 64-bit installation as required by your setup. When prompted during the installation, make sure to add Python to your platform-specific environment variable.","contentUrl":"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins"},{"title":"Get started with device twins (programming-language-csharp)","content":"# Get started with device twins (programming-language-csharp)\n## Create a backend application\nA backend application connects to a device through IoT Hub and can read device reported and desired properties, write device desired properties, and run device queries.\nThis section describes how to create backend application code to:\n1. Read and update device twin fields\n2. Create a device twin query\nThe [RegistryManager](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.registrymanager) class exposes all methods required to create a backend application to interact with device twins from the service.\n### Add service NuGet Package\nBackend service applications require the **Microsoft.Azure.Devices** NuGet package.\n### Connect to IoT hub\nYou can connect a backend service to IoT Hub using the following methods:\n1. Shared access policy\n2. Microsoft Entra\nImportant\nThis article includes steps to connect to a service using a shared access signature. This authentication method is convenient for testing and evaluation, but authenticating to a service with Microsoft Entra ID or managed identities is a more secure approach. To learn more, see [Security best practices for IoT solutions \u003E Cloud security](https://learn.microsoft.com/azure/iot/iot-overview-security#cloud-security).\n#### Connect using a shared access policy\nConnect a backend application to a device using [CreateFromConnectionString](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.registrymanager.createfromconnectionstring). Your application needs the **service connect** permission to modify desired properties of a device twin, and it needs **registry read** permission to query the identity registry. There is no default shared access policy that contains only these two permissions, so you need to create one if a one does not already exist. Supply this shared access policy connection string as a parameter to \u0060fromConnectionString\u0060. For more information about shared access policies, see [Control access to IoT Hub with shared access signatures](https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-sas).\n\u0060\u0060\u0060csharp\nusing Microsoft.Azure.Devices;\nstatic RegistryManager registryManager;\nstatic string connectionString = \u0022{Shared access policy connection string}\u0022;\nregistryManager = RegistryManager.CreateFromConnectionString(connectionString);\n\u0060\u0060\u0060\n#### Connect using Microsoft Entra\nA backend app that uses Microsoft Entra must successfully authenticate and obtain a security token credential before connecting to IoT Hub. This token is passed to a IoT Hub connection method. For general information about setting up and using Microsoft Entra for IoT Hub, see [Control access to IoT Hub by using Microsoft Entra ID](https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-azure-ad).\n##### Configure Microsoft Entra app","contentUrl":"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-backend-application"},{"title":"Get started with device twins (programming-language-node)","content":"# Get started with device twins (programming-language-node)\n## Create a device application\nDevice applications can read and write twin reported properties, and be notified of desired twin property changes that are set by a backend application or IoT Hub.\nThis section describes how to use the [azure-iot-device](https://learn.microsoft.com/en-us/javascript/api/azure-iot-device) package in the Azure IoT SDK for Node.js to create a device application to:\n1. Retrieve a device twin and examine reported properties\n2. Update reported device twin properties\n3. Receive notice of desired property changes\nImportant\nThis article includes steps to connect a device using a shared access signature, also called symmetric key authentication. This authentication method is convenient for testing and evaluation, but authenticating a device using X.509 certificates is a more secure approach. To learn more, see [Security best practices for IoT solutions \u003E Connection security](https://learn.microsoft.com/azure/iot/iot-overview-security#connection-security).\n### Install device SDK package\nRun this command to install the **azure-iot-device** device SDK on your development machine:\n\u0060\u0060\u0060cmd\nnpm install azure-iot-device --save\n\u0060\u0060\u0060\n### Connect a device to IoT Hub\nA device app can authenticate with IoT Hub using the following methods:\n1. X.509 certificate\n2. Shared access key\nImportant\nThis article includes steps to connect a device using a shared access signature, also called symmetric key authentication. This authentication method is convenient for testing and evaluation, but authenticating a device using X.509 certificates is a more secure approach. To learn more, see [Security best practices for IoT solutions \u003E Connection security](https://learn.microsoft.com/azure/iot/iot-overview-security#connection-security).\n#### Authenticate using an X.509 certificate\nThe X.509 certificate is attached to the device-to-IoT Hub connection transport.\nTo configure a device-to-IoT Hub connection using an X.509 certificate:\n1. Call [fromConnectionString](https://learn.microsoft.com/en-us/javascript/api/azure-iothub/client?#azure-iothub-client-fromconnectionstring) to add the device or identity module connection string, and transport type to the \u0060Client\u0060 object. Add \u0060x509=true\u0060 to the connection string to indicate that a certificate is added to \u0060DeviceClientOptions\u0060. For example:\n1.1. A **device** connection string:\n  \u0060HostName=xxxxx.azure-devices.net;DeviceId=Device-1;SharedAccessKey=xxxxxxxxxxxxx;x509=true\u0060\n1.2. An **identity module** connection string:","contentUrl":"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-device-application"},{"title":"Get started with device twins (programming-language-node)","content":"# Get started with device twins (programming-language-node)\n## Create a backend application\nA backend application connects to a device through IoT Hub and can read device reported and desired properties, write device desired properties, and run device queries.\nThis section describes how to create a backend application that:\n1. Retrieves and updates a device twin\n2. Creates a device twin query\n### Install service SDK package\nRun this command to install **azure-iothub** on your development machine:\n\u0060\u0060\u0060cmd\nnpm install azure-iothub --save\n\u0060\u0060\u0060\nThe [Registry](https://learn.microsoft.com/en-us/javascript/api/azure-iothub/registry) class exposes all methods required to interact with device twins from a backend application.\n### Connect to IoT hub\nYou can connect a backend service to IoT Hub using the following methods:\n1. Shared access policy\n2. Microsoft Entra\nImportant\nThis article includes steps to connect to a service using a shared access signature. This authentication method is convenient for testing and evaluation, but authenticating to a service with Microsoft Entra ID or managed identities is a more secure approach. To learn more, see [Security best practices for IoT solutions \u003E Cloud security](https://learn.microsoft.com/azure/iot/iot-overview-security#cloud-security).\n#### Connect using a shared access policy\nUse [fromConnectionString](https://learn.microsoft.com/en-us/javascript/api/azure-iothub/registry?#azure-iothub-registry-fromconnectionstring) to connect to IoT hub. Your application needs the **service connect** permission to modify desired properties of a device twin, and it needs **registry read** permission to query the identity registry. There is no default shared access policy that contains only these two permissions, so you need to create one if a one does not already exist. Supply this shared access policy connection string as a parameter to \u0060fromConnectionString\u0060. For more information about shared access policies, see [Control access to IoT Hub with shared access signatures](https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-sas).\n\u0060\u0060\u0060javascript\n\u0027use strict\u0027;\nvar iothub = require(\u0027azure-iothub\u0027);\nvar connectionString = \u0027{Shared access policy connection string}\u0027;\nvar registry = iothub.Registry.fromConnectionString(connectionString);\n\u0060\u0060\u0060\n#### Connect using Microsoft Entra","contentUrl":"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-backend-application"},{"title":"Get started with device twins (programming-language-python)","content":"# Get started with device twins (programming-language-python)\n## Create a backend application\nA backend application connects to a device through IoT Hub and can read device reported and desired properties, write device desired properties, and run device queries.\nThis section describes how to create a backend application to:\n1. Update twin tags and desired properties\n2. Queries devices using filters on the tags and properties\nThe [IoTHubRegistryManager](https://learn.microsoft.com/en-us/python/api/azure-iot-hub/azure.iot.hub.iothubregistrymanager) class exposes all methods required to create a backend application to interact with device twins from the service.\n### Connect to IoT hub\nYou can connect a backend service to IoT Hub using the following methods:\n1. Shared access policy\n2. Microsoft Entra\nImportant\nThis article includes steps to connect to a service using a shared access signature. This authentication method is convenient for testing and evaluation, but authenticating to a service with Microsoft Entra ID or managed identities is a more secure approach. To learn more, see [Security best practices for IoT solutions \u003E Cloud security](https://learn.microsoft.com/azure/iot/iot-overview-security#cloud-security).\n#### Connect using a shared access policy\nConnect to IoT hub using [from_connection_string](https://learn.microsoft.com/en-us/python/api/azure-iot-hub/azure.iot.hub.iothubregistrymanager?#azure-iot-hub-iothubregistrymanager-from-connection-string). Your application needs the **service connect** permission to modify desired properties of a device twin, and it needs **registry read** permission to query the identity registry. There is no default shared access policy that contains only these two permissions, so you need to create one if a one does not already exist. Supply this shared access policy connection string as a parameter to \u0060fromConnectionString\u0060. For more information about shared access policies, see [Control access to IoT Hub with shared access signatures](https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-sas).\nFor example:\n\u0060\u0060\u0060python\nimport sys\nfrom time import sleep\nfrom azure.iot.hub import IoTHubRegistryManager\nfrom azure.iot.hub.models import Twin, TwinProperties, QuerySpecification, QueryResult\n\n# Connect to IoT hub\nIOTHUB_CONNECTION_STRING = \u0022{IoT hub service connection string}\u0022\niothub_registry_manager = IoTHubRegistryManager.from_connection_string(IOTHUB_CONNECTION_STRING)\n\u0060\u0060\u0060\n#### Connect using Microsoft Entra","contentUrl":"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-backend-application"},{"title":"Get started with device twins (programming-language-csharp)","content":"# Get started with device twins (programming-language-csharp)\n## Create a device application\nDevice applications can read and write twin reported properties, and be notified of desired twin property changes that are set by a backend application or IoT Hub.\nThis section describes how to use device application code to:\n1. Retrieve a device twin and examine reported properties\n2. Update reported device twin properties\n3. Create a desired property update callback handler\n### Required device NuGet package\nDevice client applications written in C# require the **Microsoft.Azure.Devices.Client** NuGet package.\nAdd this \u0060using\u0060 statement to use the device library.\n\u0060\u0060\u0060csharp\nusing Microsoft.Azure.Devices.Client;\n\u0060\u0060\u0060\n### Connect a device to IoT Hub\nA device app can authenticate with IoT Hub using the following methods:\n1. Shared access key\n2. X.509 certificate\nImportant\nThis article includes steps to connect a device using a shared access signature, also called symmetric key authentication. This authentication method is convenient for testing and evaluation, but authenticating a device using X.509 certificates is a more secure approach. To learn more, see [Security best practices for IoT solutions \u003E Connection security](https://learn.microsoft.com/azure/iot/iot-overview-security#connection-security).\n#### Authenticate using a shared access key\nThe [DeviceClient](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.client.deviceclient) class exposes all the methods required to interact with device twins from the device.\nConnect to the device using the [CreateFromConnectionString](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.client.deviceclient.createfromconnectionstring?#microsoft-azure-devices-client-deviceclient-createfromconnectionstring%28system-string-microsoft-azure-devices-client-transporttype%29) method along with device connection string and the connection transport protocol.\nThe \u0060CreateFromConnectionString\u0060[TransportType](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.client.transporttype) transport protocol parameter supports the following transport protocols:\n1. \u0060Mqtt\u0060\n2. \u0060Mqtt_WebSocket_Only\u0060\n3. \u0060Mqtt_Tcp_Only\u0060\n4. \u0060Amqp\u0060\n5. \u0060Amqp_WebSocket_Only\u0060\n6. \u0060Amqp_Tcp_Only\u0060\nThe \u0060Http1\u0060 protocol is not supported for device twin updates.\nThis example connects to a device using the \u0060Mqtt\u0060 transport protocol.","contentUrl":"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-device-application"}]}},"id":"dcc539e7-852f-4b1c-9a89-c6b74a4dec48","jsonrpc":"2.0"}

