        and Play device, see [Understand IoT Plug and Play digital twins](https://learn.microsoft.com/en-us/previous-versions/azure/iot/concepts-digital-twin).\",\"contentUrl\":\"https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-device-twins\"},{\"title\":\"Get
        started with device twins (programming-language-java)\",\"content\":\"# Get
        started with device twins (programming-language-java)\\nUse the Azure IoT
        Hub device SDK and service SDK to develop applications that handle common
        device twin tasks. Device twins are JSON documents that store device state
        information including metadata, configurations, and conditions. IoT Hub persists
        a device twin for each device that connects to it.\\nYou can use device twins
        to:\\n1. Store device metadata from your solution back end\\n2. Report current
        state information such as available capabilities and conditions, for example,
        the connectivity method used, from your device app\\n3. Synchronize the state
        of long-running workflows, such as firmware and configuration updates, between
        a device app and a back-end app\\n4. Query your device metadata, configuration,
        or state\\nFor more information about device twins, including when to use
        device twins, see [Understand and use device twins in IoT Hub](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-device-twins).\\nNote\\nThe
        features described in this article are available only in the standard tier
        of IoT Hub. For more information about the basic and standard/free IoT Hub
        tiers, see [Choose the right IoT Hub tier and size for your solution](https://learn.microsoft.com/azure/iot-hub/iot-hub-scaling).\\nThis
        article shows you how to develop two types of applications:\\n1. Device apps
        can handle requests to update desired properties and respond with changes
        to reported properties.\\n2. Service apps can update device twin tags, set
        new desired properties, and query devices based on device twin values.\\nNote\\nThis
        article is meant to complement [Azure IoT SDKs](https://learn.microsoft.com/azure/iot-hub/iot-hub-devguide-sdks)
        samples that are referenced from within this article. You can use SDK tools
        to build both device and back-end applications.\\n## Prerequisites\\n1. An
        IoT hub\\n2. A registered device\\n3. If your application uses the MQTT protocol,
        make sure that port 8883 is open in your firewall. The MQTT protocol communicates
        over port 8883. This port may be blocked in some corporate and educational
        network environments. For more information and ways to work around this issue,
        see [Connecting to IoT Hub (MQTT)](https://learn.microsoft.com/azure/iot-hub/iot-mqtt-connect-to-iot-hub#connect-to-iot-hub).\\n4.
        Requires [Java SE Development Kit 8](https://learn.microsoft.com/en-us/azure/developer/java/fundamentals/).
        Make sure you select **Java 8** under **Long-term support** to navigate to
        downloads for JDK 8.\",\"contentUrl\":\"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins\"},{\"title\":\"Get
        started with device twins (programming-language-csharp)\",\"content\":\"#
