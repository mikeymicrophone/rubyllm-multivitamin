        see [Connecting to IoT Hub (MQTT)](https://learn.microsoft.com/azure/iot-hub/iot-mqtt-connect-to-iot-hub#connect-to-iot-hub).\\n4.
        Python SDK - [Python version 3.7 or later](https://www.python.org/downloads/)
        is recommended. Make sure to use the 32-bit or 64-bit installation as required
        by your setup. When prompted during the installation, make sure to add Python
        to your platform-specific environment variable.\",\"contentUrl\":\"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins\"},{\"title\":\"Get
        started with device twins (programming-language-csharp)\",\"content\":\"#
        Get started with device twins (programming-language-csharp)\\n## Create a
        backend application\\nA backend application connects to a device through IoT
        Hub and can read device reported and desired properties, write device desired
        properties, and run device queries.\\nThis section describes how to create
        backend application code to:\\n1. Read and update device twin fields\\n2.
        Create a device twin query\\nThe [RegistryManager](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.registrymanager)
        class exposes all methods required to create a backend application to interact
        with device twins from the service.\\n### Add service NuGet Package\\nBackend
        service applications require the **Microsoft.Azure.Devices** NuGet package.\\n###
        Connect to IoT hub\\nYou can connect a backend service to IoT Hub using the
        following methods:\\n1. Shared access policy\\n2. Microsoft Entra\\nImportant\\nThis
        article includes steps to connect to a service using a shared access signature.
        This authentication method is convenient for testing and evaluation, but authenticating
        to a service with Microsoft Entra ID or managed identities is a more secure
        approach. To learn more, see [Security best practices for IoT solutions \\u003E
        Cloud security](https://learn.microsoft.com/azure/iot/iot-overview-security#cloud-security).\\n####
        Connect using a shared access policy\\nConnect a backend application to a
        device using [CreateFromConnectionString](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.registrymanager.createfromconnectionstring).
        Your application needs the **service connect** permission to modify desired
        properties of a device twin, and it needs **registry read** permission to
        query the identity registry. There is no default shared access policy that
        contains only these two permissions, so you need to create one if a one does
        not already exist. Supply this shared access policy connection string as a
        parameter to \\u0060fromConnectionString\\u0060. For more information about
        shared access policies, see [Control access to IoT Hub with shared access
        signatures](https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-sas).\\n\\u0060\\u0060\\u0060csharp\\nusing
        Microsoft.Azure.Devices;\\nstatic RegistryManager registryManager;\\nstatic
        string connectionString = \\u0022{Shared access policy connection string}\\u0022;\\nregistryManager
        = RegistryManager.CreateFromConnectionString(connectionString);\\n\\u0060\\u0060\\u0060\\n####
        Connect using Microsoft Entra\\nA backend app that uses Microsoft Entra must
        successfully authenticate and obtain a security token credential before connecting
        to IoT Hub. This token is passed to a IoT Hub connection method. For general
        information about setting up and using Microsoft Entra for IoT Hub, see [Control
        access to IoT Hub by using Microsoft Entra ID](https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-azure-ad).\\n#####
        Configure Microsoft Entra app\",\"contentUrl\":\"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-backend-application\"},{\"title\":\"Get
        started with device twins (programming-language-node)\",\"content\":\"# Get
        started with device twins (programming-language-node)\\n## Create a device
        application\\nDevice applications can read and write twin reported properties,
        and be notified of desired twin property changes that are set by a backend
        application or IoT Hub.\\nThis section describes how to use the [azure-iot-device](https://learn.microsoft.com/en-us/javascript/api/azure-iot-device)
        package in the Azure IoT SDK for Node.js to create a device application to:\\n1.
        Retrieve a device twin and examine reported properties\\n2. Update reported
        device twin properties\\n3. Receive notice of desired property changes\\nImportant\\nThis
        article includes steps to connect a device using a shared access signature,
        also called symmetric key authentication. This authentication method is convenient
        for testing and evaluation, but authenticating a device using X.509 certificates
        is a more secure approach. To learn more, see [Security best practices for
        IoT solutions \\u003E Connection security](https://learn.microsoft.com/azure/iot/iot-overview-security#connection-security).\\n###
        Install device SDK package\\nRun this command to install the **azure-iot-device**
        device SDK on your development machine:\\n\\u0060\\u0060\\u0060cmd\\nnpm install
        azure-iot-device --save\\n\\u0060\\u0060\\u0060\\n### Connect a device to
        IoT Hub\\nA device app can authenticate with IoT Hub using the following methods:\\n1.
        X.509 certificate\\n2. Shared access key\\nImportant\\nThis article includes
        steps to connect a device using a shared access signature, also called symmetric
        key authentication. This authentication method is convenient for testing and
        evaluation, but authenticating a device using X.509 certificates is a more
        secure approach. To learn more, see [Security best practices for IoT solutions
        \\u003E Connection security](https://learn.microsoft.com/azure/iot/iot-overview-security#connection-security).\\n####
        Authenticate using an X.509 certificate\\nThe X.509 certificate is attached
        to the device-to-IoT Hub connection transport.\\nTo configure a device-to-IoT
        Hub connection using an X.509 certificate:\\n1. Call [fromConnectionString](https://learn.microsoft.com/en-us/javascript/api/azure-iothub/client?#azure-iothub-client-fromconnectionstring)
        to add the device or identity module connection string, and transport type
        to the \\u0060Client\\u0060 object. Add \\u0060x509=true\\u0060 to the connection
        string to indicate that a certificate is added to \\u0060DeviceClientOptions\\u0060.
        For example:\\n1.1. A **device** connection string:\\n  \\u0060HostName=xxxxx.azure-devices.net;DeviceId=Device-1;SharedAccessKey=xxxxxxxxxxxxx;x509=true\\u0060\\n1.2.
        An **identity module** connection string:\",\"contentUrl\":\"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-device-application\"},{\"title\":\"Get
        started with device twins (programming-language-node)\",\"content\":\"# Get
        started with device twins (programming-language-node)\\n## Create a backend
        application\\nA backend application connects to a device through IoT Hub and
        can read device reported and desired properties, write device desired properties,
        and run device queries.\\nThis section describes how to create a backend application
        that:\\n1. Retrieves and updates a device twin\\n2. Creates a device twin
        query\\n### Install service SDK package\\nRun this command to install **azure-iothub**
        on your development machine:\\n\\u0060\\u0060\\u0060cmd\\nnpm install azure-iothub
        --save\\n\\u0060\\u0060\\u0060\\nThe [Registry](https://learn.microsoft.com/en-us/javascript/api/azure-iothub/registry)
        class exposes all methods required to interact with device twins from a backend
        application.\\n### Connect to IoT hub\\nYou can connect a backend service
        to IoT Hub using the following methods:\\n1. Shared access policy\\n2. Microsoft
        Entra\\nImportant\\nThis article includes steps to connect to a service using
        a shared access signature. This authentication method is convenient for testing
        and evaluation, but authenticating to a service with Microsoft Entra ID or
        managed identities is a more secure approach. To learn more, see [Security
        best practices for IoT solutions \\u003E Cloud security](https://learn.microsoft.com/azure/iot/iot-overview-security#cloud-security).\\n####
        Connect using a shared access policy\\nUse [fromConnectionString](https://learn.microsoft.com/en-us/javascript/api/azure-iothub/registry?#azure-iothub-registry-fromconnectionstring)
        to connect to IoT hub. Your application needs the **service connect** permission
        to modify desired properties of a device twin, and it needs **registry read**
        permission to query the identity registry. There is no default shared access
        policy that contains only these two permissions, so you need to create one
        if a one does not already exist. Supply this shared access policy connection
        string as a parameter to \\u0060fromConnectionString\\u0060. For more information
        about shared access policies, see [Control access to IoT Hub with shared access
        signatures](https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-sas).\\n\\u0060\\u0060\\u0060javascript\\n\\u0027use
        strict\\u0027;\\nvar iothub = require(\\u0027azure-iothub\\u0027);\\nvar connectionString
        = \\u0027{Shared access policy connection string}\\u0027;\\nvar registry =
        iothub.Registry.fromConnectionString(connectionString);\\n\\u0060\\u0060\\u0060\\n####
        Connect using Microsoft Entra\",\"contentUrl\":\"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-backend-application\"},{\"title\":\"Get
        started with device twins (programming-language-python)\",\"content\":\"#
        Get started with device twins (programming-language-python)\\n## Create a
        backend application\\nA backend application connects to a device through IoT
        Hub and can read device reported and desired properties, write device desired
        properties, and run device queries.\\nThis section describes how to create
        a backend application to:\\n1. Update twin tags and desired properties\\n2.
        Queries devices using filters on the tags and properties\\nThe [IoTHubRegistryManager](https://learn.microsoft.com/en-us/python/api/azure-iot-hub/azure.iot.hub.iothubregistrymanager)
        class exposes all methods required to create a backend application to interact
        with device twins from the service.\\n### Connect to IoT hub\\nYou can connect
        a backend service to IoT Hub using the following methods:\\n1. Shared access
        policy\\n2. Microsoft Entra\\nImportant\\nThis article includes steps to connect
        to a service using a shared access signature. This authentication method is
        convenient for testing and evaluation, but authenticating to a service with
        Microsoft Entra ID or managed identities is a more secure approach. To learn
        more, see [Security best practices for IoT solutions \\u003E Cloud security](https://learn.microsoft.com/azure/iot/iot-overview-security#cloud-security).\\n####
        Connect using a shared access policy\\nConnect to IoT hub using [from_connection_string](https://learn.microsoft.com/en-us/python/api/azure-iot-hub/azure.iot.hub.iothubregistrymanager?#azure-iot-hub-iothubregistrymanager-from-connection-string).
        Your application needs the **service connect** permission to modify desired
        properties of a device twin, and it needs **registry read** permission to
        query the identity registry. There is no default shared access policy that
        contains only these two permissions, so you need to create one if a one does
        not already exist. Supply this shared access policy connection string as a
        parameter to \\u0060fromConnectionString\\u0060. For more information about
        shared access policies, see [Control access to IoT Hub with shared access
        signatures](https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-sas).\\nFor
        example:\\n\\u0060\\u0060\\u0060python\\nimport sys\\nfrom time import sleep\\nfrom
        azure.iot.hub import IoTHubRegistryManager\\nfrom azure.iot.hub.models import
        Twin, TwinProperties, QuerySpecification, QueryResult\\n\\n# Connect to IoT
        hub\\nIOTHUB_CONNECTION_STRING = \\u0022{IoT hub service connection string}\\u0022\\niothub_registry_manager
        = IoTHubRegistryManager.from_connection_string(IOTHUB_CONNECTION_STRING)\\n\\u0060\\u0060\\u0060\\n####
        Connect using Microsoft Entra\",\"contentUrl\":\"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-backend-application\"},{\"title\":\"Get
        started with device twins (programming-language-csharp)\",\"content\":\"#
        Get started with device twins (programming-language-csharp)\\n## Create a
        device application\\nDevice applications can read and write twin reported
        properties, and be notified of desired twin property changes that are set
        by a backend application or IoT Hub.\\nThis section describes how to use device
        application code to:\\n1. Retrieve a device twin and examine reported properties\\n2.
        Update reported device twin properties\\n3. Create a desired property update
        callback handler\\n### Required device NuGet package\\nDevice client applications
        written in C# require the **Microsoft.Azure.Devices.Client** NuGet package.\\nAdd
        this \\u0060using\\u0060 statement to use the device library.\\n\\u0060\\u0060\\u0060csharp\\nusing
        Microsoft.Azure.Devices.Client;\\n\\u0060\\u0060\\u0060\\n### Connect a device
        to IoT Hub\\nA device app can authenticate with IoT Hub using the following
        methods:\\n1. Shared access key\\n2. X.509 certificate\\nImportant\\nThis
        article includes steps to connect a device using a shared access signature,
        also called symmetric key authentication. This authentication method is convenient
        for testing and evaluation, but authenticating a device using X.509 certificates
        is a more secure approach. To learn more, see [Security best practices for
        IoT solutions \\u003E Connection security](https://learn.microsoft.com/azure/iot/iot-overview-security#connection-security).\\n####
        Authenticate using a shared access key\\nThe [DeviceClient](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.client.deviceclient)
        class exposes all the methods required to interact with device twins from
        the device.\\nConnect to the device using the [CreateFromConnectionString](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.client.deviceclient.createfromconnectionstring?#microsoft-azure-devices-client-deviceclient-createfromconnectionstring%28system-string-microsoft-azure-devices-client-transporttype%29)
        method along with device connection string and the connection transport protocol.\\nThe
        \\u0060CreateFromConnectionString\\u0060[TransportType](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.devices.client.transporttype)
        transport protocol parameter supports the following transport protocols:\\n1.
        \\u0060Mqtt\\u0060\\n2. \\u0060Mqtt_WebSocket_Only\\u0060\\n3. \\u0060Mqtt_Tcp_Only\\u0060\\n4.
        \\u0060Amqp\\u0060\\n5. \\u0060Amqp_WebSocket_Only\\u0060\\n6. \\u0060Amqp_Tcp_Only\\u0060\\nThe
        \\u0060Http1\\u0060 protocol is not supported for device twin updates.\\nThis
        example connects to a device using the \\u0060Mqtt\\u0060 transport protocol.\",\"contentUrl\":\"https://learn.microsoft.com/azure/iot-hub/how-to-device-twins#create-a-device-application\"}]}"}],"instructions":"You
