        samples that are referenced from within this article. You can use SDK tools
        to build both device and back-end applications.\\n## Prerequisites\\n1. An
        IoT hub\\n2. A registered device\\n3. If your application uses the MQTT protocol,
        make sure that port 8883 is open in your firewall. The MQTT protocol communicates
        over port 8883. This port may be blocked in some corporate and educational
