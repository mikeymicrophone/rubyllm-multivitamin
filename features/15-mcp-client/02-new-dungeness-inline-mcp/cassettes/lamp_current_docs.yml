        data: {"result":{"content":[{"type":"text","text":"{\u0022results\u0022:[{\u0022title\u0022:\u0022Custom metrics in Azure Monitor (preview)\u0022,\u0022content\u0022:\u0022# Custom metrics in Azure Monitor (preview)\\n## Pricing model\\nIngesting standard metrics (platform metrics) into an Azure Monitor metrics store is free. Native custom metrics are also free during the preview. Queries to the metrics API incur costs. Because custom metrics remain in preview and won\\u0027t be made generally available, use the [generally available OpenTelemetry-based replacement](https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview) for a supported billing model. For current metric and query pricing, see the [Azure Monitor pricing page](https://azure.microsoft.com/pricing/details/monitor/).\\n## Custom metric definitions\\nEach metric data point you publish contains a namespace, name, and dimension information. The first time you emit a custom metric to Azure Monitor, the service automatically creates a metric definition. You can discover this new metric definition on any resource that the metric is emitted from via the metric definitions. You don\\u0027t need to predefine a custom metric in Azure Monitor before you emit it.\\nNote\\nApplication Insights and the InfluxData Telegraf agent are already configured to emit metric values against the correct regional endpoint and carry all the preceding properties in each emission.\\n## Using custom metrics\\nAfter custom metrics are submitted to Azure Monitor, you can browse through them via the Azure portal and query them via the Azure Monitor REST APIs. You can also create alerts on them to notify you when certain conditions are met.\\nNote\\nYou need the [Monitoring Reader](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles#monitoring-reader) role to view custom metrics.\\n### Browse your custom metrics via the Azure portal\\n1. Go to the [Azure portal](https://portal.azure.com).\\n2. Select the **Monitor** pane.\\n3. Select **Metrics**.\\n4. Select a resource that you emit custom metrics against.\\n5. Select the metrics namespace for your custom metric.\\n6. Select the custom metric.\\nFor more information on viewing metrics in the Azure portal, see [Analyze metrics with Azure Monitor metrics explorer](https://learn.microsoft.com/azure/azure-monitor/metrics/analyze-metrics).\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-custom-overview#pricing-model\u0022},{\u0022title\u0022:\u0022Custom metrics in Azure Monitor (preview)\u0022,\u0022content\u0022:\u0022# Custom metrics in Azure Monitor (preview)\\n## Quotas and limits\\nAzure Monitor imposes the following usage limits on custom metrics:\\n| Category | Limit| \\n|  --- | ---  |\\n| Total active time series in a subscription per region | 50,000 |\\n| Dimension keys per metric | 10 |\\n| String length for metric namespaces, metric names, dimension keys, and dimension values | 256 characters |\\n| The combined length of all custom metric names, using utf-8 encoding | 64 KB |\\n\\nAn active time series is any unique combination of metric, dimension key, or dimension value that has metric values published in the past 12 hours.\\nTo understand the limit of 50,000 on time series, consider the following metric:\\n\\n*Server response time* with Dimensions: *Region*, *Department*, *CustomerID*\\n\\nWith this metric, if you have 10 regions, 20 departments, and 100 customers, that gives you 10 x 20 x 100 = 20,000 time series.\\nIf you have 100 regions, 200 departments, and 2,000 customers, the result is 100 x 200 x 2,000 = 40 million time series. This number is far over the limit for a single metric.\\nAgain, this limit isn\\u0027t for an individual metric. It\\u0027s for the sum of all such metrics across a subscription and region.\\nTo see your current total active time series metrics and get more information for troubleshooting, follow these steps.\\n1. Navigate to the Monitor section of the Azure portal.\\n2. Select **Metrics** on the left hand side.\\n3. Under **Select a scope**, check the applicable subscription and resource groups.\\n4. Under **Refine scope**, choose **Custom Metric Usage** and the desired location.\\n5. Select the **Apply** button.\\n6. Choose either **Active Time Series**, **Active Time Series Limit**, or **Throttled Time Series**.\\nAzure Monitor limits the combined length of all custom metric names to 64 KB, assuming UTF-8 encoding or 1 byte per character. If your metric names exceed this limit, Azure Monitor blocks access to metadata for the other metrics. The Azure portal omits those metric names from selection fields, and the API skips them when it returns metric definitions. You can still query the metric data directly, even without the metadata.\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-custom-overview#quotas-and-limits\u0022},{\u0022title\u0022:\u0022Custom metrics in Azure Monitor (preview)\u0022,\u0022content\u0022:\u0022# Custom metrics in Azure Monitor (preview)\\nAzure provides metrics out of the box. These metrics are called [standard or platform](https://learn.microsoft.com/azure/azure-monitor/reference/metrics-index) metrics. Custom metrics are performance indicators or business-specific metrics. You can collect them through your application\\u0027s telemetry. You can also use the Azure Monitor Agent or an external monitoring system. After you publish custom metrics to Azure Monitor, you can browse, query, and alert on them along with the standard Azure metrics.\\nNote\\nAzure Monitor custom metrics are in public preview. This feature won\\u0027t be made generally available, because an improved generally available feature achieves the same functionality and more: [Application Insights with OpenTelemetry](https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview). In addition to custom metrics, [OpenTelemetry performance counters](https://learn.microsoft.com/azure/azure-monitor/vm/metrics-opentelemetry-guest) from the guest OS of VMs are supported as well.\\n## Use the generally available replacement\\nThe custom metrics described in this article remain in preview and won\\u0027t be made generally available. For new solutions, use the generally available OpenTelemetry-based path, which provides the same functionality and more. To get started, see [Application Insights with OpenTelemetry](https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview) and [OpenTelemetry system metrics for virtual machines](https://learn.microsoft.com/azure/azure-monitor/vm/metrics-opentelemetry-guest).\\n## Methods to send custom metrics\\nCustom metrics can be sent to Azure Monitor via several methods:\\n1. Use the Application Insights SDK to instrument your application by sending custom telemetry to Azure Monitor.\\n2. Install the [Azure Monitor Agent](https://learn.microsoft.com/azure/azure-monitor/agents/azure-monitor-agent-overview) on your Windows or Linux Azure virtual machine or virtual machine scale set and use a [data collection rule](https://learn.microsoft.com/azure/azure-monitor/vm/data-collection) to send performance counters to Azure Monitor metrics.\\n3. Install the [InfluxData Telegraf agent](https://learn.microsoft.com/azure/azure-monitor/agents/collect-custom-metrics-linux-telegraf) on your Azure Linux VM. Send metrics by using the Azure Monitor output plug-in.\\n4. Send custom metrics [directly to the Azure Monitor REST API](https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-store-custom-rest-api).\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-custom-overview\u0022},{\u0022title\u0022:\u0022Ingest custom metrics for an Azure resource using the REST API\u0022,\u0022content\u0022:\u0022# Ingest custom metrics for an Azure resource using the REST API\\n## Send REST requests to ingest custom metrics\\nWith this process, you can emit multiple values for the same metric/dimension combination during a given minute. Azure Monitor then takes all the raw values emitted for a given minute and aggregates them.\\n### Sample custom metric publication\\nIn the following example, create a custom metric called **Memory Bytes in Use** under the metric namespace **Memory Profile** for a virtual machine. The metric has a single dimension called **Process**. For the timestamp, metric values are emitted for two processes.\\nStore the following JSON in a file called *custommetric.json* on your local computer. Update the time parameter so that it\\u0027s within the last 20 minutes. You can\\u0027t put a metric into the store that\\u0027s more than 20 minutes old.\\nSubmit the following HTTP POST request by using the following variables:\\n1. \\u0060location\\u0060: Deployment region of the resource you\\u0027re emitting metrics for.\\n2. \\u0060resourceId\\u0060: Resource ID of the Azure resource you\\u0027re tracking the metric against.\\n3. \\u0060accessToken\\u0060: The authorization token acquired from the *Get an authorization token* step.\\n\\u0060\\u0060\\u0060console\\n  curl -X POST \\u0027https://\\u003Clocation\\u003E.monitoring.azure.com/\\u003CresourceId\\u003E/metrics\\u0027 \\\\\\n  -H \\u0027Content-Type: application/json\\u0027 \\\\\\n  -H \\u0027Authorization: Bearer \\u003CaccessToken\\u003E\\u0027 \\\\\\n  -d @custommetric.json\\n\\u0060\\u0060\\u0060\\n## View your metrics\\n1. Sign in to the Azure portal.\\n2. In the menu on the left, select **Monitor**.\\n3. On the **Monitor** page, select **Metrics**.\\n ![Screenshot that shows how to select Metrics in the Azure portal.](https://learn.microsoft.com/azure/azure-monitor/metrics/media/metrics-store-custom-rest-api/metrics.png)\\n4. Change the aggregation period to **Last hour**.\\n5. In the **Scope** dropdown list, select the resource you send the metric for.\\n6. In the **Metric Namespace** dropdown list, select **Memory Profile**.\\n7. In the **Metric** dropdown list, select **Memory Bytes in Use**.\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-store-custom-rest-api#send-rest-requests-to-ingest-custom-metrics\u0022},{\u0022title\u0022:\u0022Custom metrics in Azure Monitor (preview)\u0022,\u0022content\u0022:\u0022# Custom metrics in Azure Monitor (preview)\\n## Design limitations and considerations\\nBut if high cardinality is essential for your scenario, the aggregated metrics are probably not the right choice. Switch to using custom logs (that is, trackMetric API calls with [trackEvent](https://learn.microsoft.com/azure/azure-monitor/app/usage#how-to-log-custom-events)). However, consider that logs don\\u0027t aggregate values, so every single entry is stored. As a result, if you have a large volume of logs in a small time period (1 million a second, for example), it can cause throttling and ingestion delays.\\nTip\\nAzure Monitor Metrics and Azure Monitor Workspace ingest custom metrics at a fixed 60-second interval. Metrics sent more frequently are buffered and processed once every 60 seconds. Log Analytics records metrics at the interval they\\u2019re sent, which can increase cost at shorter intervals and delay visibility at longer ones.\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-custom-overview#design-limitations-and-considerations\u0022},{\u0022title\u0022:\u0022Custom metrics in Azure Monitor (preview)\u0022,\u0022content\u0022:\u0022# Custom metrics in Azure Monitor (preview)\\n## Quotas and limits\\nWhen the limit is exceeded, reduce the number of metrics you\\u0027re sending or shorten the length of their names. It takes up to two days for the new metrics\\u0027 names to appear.\\nTo avoid reaching the limit, don\\u0027t include variable or dimensional aspects in your metric names. For example, the metrics for server CPU usage,\\u0060CPU_server_12345678-319d-4a50-b27e-1234567890ab\\u0060 and \\u0060CPU_server_abcdef01-319d-4a50-b27e-abcdef012345\\u0060 should be defined as metric \\u0060CPU\\u0060 and with a \\u0060Server\\u0060 dimension.\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-custom-overview#quotas-and-limits\u0022},{\u0022title\u0022:\u0022Ingest custom metrics for an Azure resource using the REST API\u0022,\u0022content\u0022:\u0022# Ingest custom metrics for an Azure resource using the REST API\\n## Send REST requests to ingest custom metrics\\nThe region property captures the Azure region where the resource you\\u0027re emitting metrics for is deployed. Metrics must be emitted to the same Azure Monitor regional endpoint as the region where the resource is deployed. For example, custom metrics for a VM deployed in West US must be sent to the WestUS regional Azure Monitor endpoint. The region information is also encoded in the URL of the API call.\\n### Timestamp\\nEach data point sent to Azure Monitor must be marked with a timestamp. This timestamp captures the date and time at which the metric value is measured or collected. Azure Monitor accepts metric data with timestamps as far as 20 minutes in the past and 5 minutes in the future. The timestamp must be in ISO 8601 format.\\n### Namespace\\nNamespaces are a way to categorize or group similar metrics together. By using namespaces, you can achieve isolation between groups of metrics that might collect different insights or performance indicators. For example, you might have a namespace called **contosomemorymetrics** that tracks memory-use metrics which profile your app. Another namespace called **contosoapptransaction** might track all metrics about user transactions in your application.\\n### Name\\nThe name property is the name of the metric that\\u0027s being reported. Usually, the name is descriptive enough to help identify what\\u0027s measured. An example is a metric that measures the number of memory bytes used on a VM. It might have a metric name like **Memory Bytes In Use**.\\n### Dimension keys\\nA dimension is a key/value pair that helps describe other characteristics about the metric that\\u0027s being collected. By using the other characteristics, you can collect more information about the metric, which allows for deeper insights.\\nFor example, the **Memory Bytes In Use** metric might have a dimension key called **Process** that captures how many bytes of memory each process on a VM consumes. By using this key, you can filter the metric to see how much memory specific processes use or to identify the top five processes by memory usage.\\nDimensions are optional, and not all metrics have dimensions. A custom metric can have up to 10 dimensions.\\n### Dimension values\\nWhen you\\u0027re reporting a metric data point, for each dimension key on the reported metric, there\\u0027s a corresponding dimension value. For example, you might want to report the memory that ContosoApp uses on your VM:\\n1. The metric name would be **Memory Bytes in Use**.\\n2. The dimension key would be **Process**.\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-store-custom-rest-api#send-rest-requests-to-ingest-custom-metrics\u0022},{\u0022title\u0022:\u0022Ingest custom metrics for an Azure resource using the REST API\u0022,\u0022content\u0022:\u0022# Ingest custom metrics for an Azure resource using the REST API\\nThis article shows you how to send custom metrics for Azure resources to the Azure Monitor metrics store via the REST API. When the metrics are in Azure Monitor, you can do all the things with them that you do with standard metrics. For example, you can generate charts and alerts and route the metrics to other external tools.\\nNote\\nThe REST API only permits sending custom metrics for Azure resources. To send metrics for resources in other environments or on-premises, use [Application Insights](https://learn.microsoft.com/azure/azure-monitor/app/api-custom-events-metrics).\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-store-custom-rest-api\u0022},{\u0022title\u0022:\u0022Custom metrics in Azure Monitor (preview)\u0022,\u0022content\u0022:\u0022# Custom metrics in Azure Monitor (preview)\\n## Latency and storage retention\\nCustom metrics are retained for the [same amount of time as platform metrics](https://learn.microsoft.com/azure/azure-monitor/metrics/data-platform-metrics#retention-of-metrics).\\nA newly added metric or a newly added dimension to a metric might take up to 3 minutes to appear. After the data is in the system, it should appear in less than 30 seconds 99 percent of the time.\\nIf you delete a metric or remove a dimension, the change can take a week to a month to be deleted from the system.\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-custom-overview#latency-and-storage-retention\u0022},{\u0022title\u0022:\u0022Ingest custom metrics for an Azure resource using the REST API\u0022,\u0022content\u0022:\u0022# Ingest custom metrics for an Azure resource using the REST API\\n## Send REST requests to ingest custom metrics\\nWhen you send custom metrics to Azure Monitor, each data point, or value, reported in the metrics must include the following information.\\n1. Authentication token\\n2. Subject\\n3. Region\\n4. Timestamp\\n5. Namespace\\n6. Name\\n7. Dimension keys\\n8. Dimension values\\n9. Metric values\\n### Authentication\\nTo submit custom metrics to Azure Monitor, the entity that submits the metric needs a valid Microsoft Entra token in the **Bearer** header of the request. Supported ways to acquire a valid bearer token include:\\n1. [Managed identities for Azure resources](https://learn.microsoft.com/en-us/azure/active-directory/managed-identities-azure-resources/overview). You can use a managed identity to give resources permissions to carry out certain operations. An example is allowing a resource to emit metrics about itself. A resource, or its managed identity, can be granted **Monitoring Metrics Publisher** permissions on another resource. With this permission, the managed identity can also emit metrics for other resources.\\n2. [Microsoft Entra service principal](https://learn.microsoft.com/en-us/azure/active-directory/develop/app-objects-and-service-principals). In this scenario, a Microsoft Entra application, or service, can be assigned permissions to emit metrics about an Azure resource. To authenticate the request, Azure Monitor validates the application token by using Microsoft Entra public keys. The existing **Monitoring Metrics Publisher** role already has this permission. It\\u0027s available in the Azure portal.\\n  The service principal, depending on what resources it emits custom metrics for, can be given the **Monitoring Metrics Publisher** role at the scope required. Examples are a subscription, resource group, or specific resource.\\nTip\\nWhen you request a Microsoft Entra token to emit custom metrics, ensure that the audience or resource that the token is requested for is \\u0060https://monitoring.azure.com/\\u0060. Be sure to include the trailing slash.\\n### Get an authorization token\\nOnce you have created your managed identity or service principal and assigned **Monitoring Metrics Publisher** permissions, you can get an authorization token. When requesting a token specify \\u0060resource: https://monitoring.azure.com\\u0060.\\nGet an authentication token using any of the following methods:\\n1. CLI\\n2. REST API\\n3. SDK\u0022,\u0022contentUrl\u0022:\u0022https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-store-custom-rest-api#send-rest-requests-to-ingest-custom-metrics\u0022}]}"}],"structuredContent":{"results":[{"title":"Custom metrics in Azure Monitor (preview)","content":"# Custom metrics in Azure Monitor (preview)\n## Pricing model\nIngesting standard metrics (platform metrics) into an Azure Monitor metrics store is free. Native custom metrics are also free during the preview. Queries to the metrics API incur costs. Because custom metrics remain in preview and won\u0027t be made generally available, use the [generally available OpenTelemetry-based replacement](https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview) for a supported billing model. For current metric and query pricing, see the [Azure Monitor pricing page](https://azure.microsoft.com/pricing/details/monitor/).\n## Custom metric definitions\nEach metric data point you publish contains a namespace, name, and dimension information. The first time you emit a custom metric to Azure Monitor, the service automatically creates a metric definition. You can discover this new metric definition on any resource that the metric is emitted from via the metric definitions. You don\u0027t need to predefine a custom metric in Azure Monitor before you emit it.\nNote\nApplication Insights and the InfluxData Telegraf agent are already configured to emit metric values against the correct regional endpoint and carry all the preceding properties in each emission.\n## Using custom metrics\nAfter custom metrics are submitted to Azure Monitor, you can browse through them via the Azure portal and query them via the Azure Monitor REST APIs. You can also create alerts on them to notify you when certain conditions are met.\nNote\nYou need the [Monitoring Reader](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles#monitoring-reader) role to view custom metrics.\n### Browse your custom metrics via the Azure portal\n1. Go to the [Azure portal](https://portal.azure.com).\n2. Select the **Monitor** pane.\n3. Select **Metrics**.\n4. Select a resource that you emit custom metrics against.\n5. Select the metrics namespace for your custom metric.\n6. Select the custom metric.\nFor more information on viewing metrics in the Azure portal, see [Analyze metrics with Azure Monitor metrics explorer](https://learn.microsoft.com/azure/azure-monitor/metrics/analyze-metrics).","contentUrl":"https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-custom-overview#pricing-model"},{"title":"Custom metrics in Azure Monitor (preview)","content":"# Custom metrics in Azure Monitor (preview)\n## Quotas and limits\nAzure Monitor imposes the following usage limits on custom metrics:\n| Category | Limit| \n|  --- | ---  |\n| Total active time series in a subscription per region | 50,000 |\n| Dimension keys per metric | 10 |\n| String length for metric namespaces, metric names, dimension keys, and dimension values | 256 characters |\n| The combined length of all custom metric names, using utf-8 encoding | 64 KB |\n\nAn active time series is any unique combination of metric, dimension key, or dimension value that has metric values published in the past 12 hours.\nTo understand the limit of 50,000 on time series, consider the following metric:\n\n*Server response time* with Dimensions: *Region*, *Department*, *CustomerID*\n\nWith this metric, if you have 10 regions, 20 departments, and 100 customers, that gives you 10 x 20 x 100 = 20,000 time series.\nIf you have 100 regions, 200 departments, and 2,000 customers, the result is 100 x 200 x 2,000 = 40 million time series. This number is far over the limit for a single metric.\nAgain, this limit isn\u0027t for an individual metric. It\u0027s for the sum of all such metrics across a subscription and region.\nTo see your current total active time series metrics and get more information for troubleshooting, follow these steps.\n1. Navigate to the Monitor section of the Azure portal.\n2. Select **Metrics** on the left hand side.\n3. Under **Select a scope**, check the applicable subscription and resource groups.\n4. Under **Refine scope**, choose **Custom Metric Usage** and the desired location.\n5. Select the **Apply** button.\n6. Choose either **Active Time Series**, **Active Time Series Limit**, or **Throttled Time Series**.\nAzure Monitor limits the combined length of all custom metric names to 64 KB, assuming UTF-8 encoding or 1 byte per character. If your metric names exceed this limit, Azure Monitor blocks access to metadata for the other metrics. The Azure portal omits those metric names from selection fields, and the API skips them when it returns metric definitions. You can still query the metric data directly, even without the metadata.","contentUrl":"https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-custom-overview#quotas-and-limits"},{"title":"Custom metrics in Azure Monitor (preview)","content":"# Custom metrics in Azure Monitor (preview)\nAzure provides metrics out of the box. These metrics are called [standard or platform](https://learn.microsoft.com/azure/azure-monitor/reference/metrics-index) metrics. Custom metrics are performance indicators or business-specific metrics. You can collect them through your application\u0027s telemetry. You can also use the Azure Monitor Agent or an external monitoring system. After you publish custom metrics to Azure Monitor, you can browse, query, and alert on them along with the standard Azure metrics.\nNote\nAzure Monitor custom metrics are in public preview. This feature won\u0027t be made generally available, because an improved generally available feature achieves the same functionality and more: [Application Insights with OpenTelemetry](https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview). In addition to custom metrics, [OpenTelemetry performance counters](https://learn.microsoft.com/azure/azure-monitor/vm/metrics-opentelemetry-guest) from the guest OS of VMs are supported as well.\n## Use the generally available replacement\nThe custom metrics described in this article remain in preview and won\u0027t be made generally available. For new solutions, use the generally available OpenTelemetry-based path, which provides the same functionality and more. To get started, see [Application Insights with OpenTelemetry](https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview) and [OpenTelemetry system metrics for virtual machines](https://learn.microsoft.com/azure/azure-monitor/vm/metrics-opentelemetry-guest).\n## Methods to send custom metrics\nCustom metrics can be sent to Azure Monitor via several methods:\n1. Use the Application Insights SDK to instrument your application by sending custom telemetry to Azure Monitor.\n2. Install the [Azure Monitor Agent](https://learn.microsoft.com/azure/azure-monitor/agents/azure-monitor-agent-overview) on your Windows or Linux Azure virtual machine or virtual machine scale set and use a [data collection rule](https://learn.microsoft.com/azure/azure-monitor/vm/data-collection) to send performance counters to Azure Monitor metrics.\n3. Install the [InfluxData Telegraf agent](https://learn.microsoft.com/azure/azure-monitor/agents/collect-custom-metrics-linux-telegraf) on your Azure Linux VM. Send metrics by using the Azure Monitor output plug-in.\n4. Send custom metrics [directly to the Azure Monitor REST API](https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-store-custom-rest-api).","contentUrl":"https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-custom-overview"},{"title":"Ingest custom metrics for an Azure resource using the REST API","content":"# Ingest custom metrics for an Azure resource using the REST API\n## Send REST requests to ingest custom metrics\nWith this process, you can emit multiple values for the same metric/dimension combination during a given minute. Azure Monitor then takes all the raw values emitted for a given minute and aggregates them.\n### Sample custom metric publication\nIn the following example, create a custom metric called **Memory Bytes in Use** under the metric namespace **Memory Profile** for a virtual machine. The metric has a single dimension called **Process**. For the timestamp, metric values are emitted for two processes.\nStore the following JSON in a file called *custommetric.json* on your local computer. Update the time parameter so that it\u0027s within the last 20 minutes. You can\u0027t put a metric into the store that\u0027s more than 20 minutes old.\nSubmit the following HTTP POST request by using the following variables:\n1. \u0060location\u0060: Deployment region of the resource you\u0027re emitting metrics for.\n2. \u0060resourceId\u0060: Resource ID of the Azure resource you\u0027re tracking the metric against.\n3. \u0060accessToken\u0060: The authorization token acquired from the *Get an authorization token* step.\n\u0060\u0060\u0060console\n  curl -X POST \u0027https://\u003Clocation\u003E.monitoring.azure.com/\u003CresourceId\u003E/metrics\u0027 \\\n  -H \u0027Content-Type: application/json\u0027 \\\n  -H \u0027Authorization: Bearer \u003CaccessToken\u003E\u0027 \\\n  -d @custommetric.json\n\u0060\u0060\u0060\n## View your metrics\n1. Sign in to the Azure portal.\n2. In the menu on the left, select **Monitor**.\n3. On the **Monitor** page, select **Metrics**.\n ![Screenshot that shows how to select Metrics in the Azure portal.](https://learn.microsoft.com/azure/azure-monitor/metrics/media/metrics-store-custom-rest-api/metrics.png)\n4. Change the aggregation period to **Last hour**.\n5. In the **Scope** dropdown list, select the resource you send the metric for.\n6. In the **Metric Namespace** dropdown list, select **Memory Profile**.\n7. In the **Metric** dropdown list, select **Memory Bytes in Use**.","contentUrl":"https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-store-custom-rest-api#send-rest-requests-to-ingest-custom-metrics"},{"title":"Custom metrics in Azure Monitor (preview)","content":"# Custom metrics in Azure Monitor (preview)\n## Design limitations and considerations\nBut if high cardinality is essential for your scenario, the aggregated metrics are probably not the right choice. Switch to using custom logs (that is, trackMetric API calls with [trackEvent](https://learn.microsoft.com/azure/azure-monitor/app/usage#how-to-log-custom-events)). However, consider that logs don\u0027t aggregate values, so every single entry is stored. As a result, if you have a large volume of logs in a small time period (1 million a second, for example), it can cause throttling and ingestion delays.\nTip\nAzure Monitor Metrics and Azure Monitor Workspace ingest custom metrics at a fixed 60-second interval. Metrics sent more frequently are buffered and processed once every 60 seconds. Log Analytics records metrics at the interval they\u2019re sent, which can increase cost at shorter intervals and delay visibility at longer ones.","contentUrl":"https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-custom-overview#design-limitations-and-considerations"},{"title":"Custom metrics in Azure Monitor (preview)","content":"# Custom metrics in Azure Monitor (preview)\n## Quotas and limits\nWhen the limit is exceeded, reduce the number of metrics you\u0027re sending or shorten the length of their names. It takes up to two days for the new metrics\u0027 names to appear.\nTo avoid reaching the limit, don\u0027t include variable or dimensional aspects in your metric names. For example, the metrics for server CPU usage,\u0060CPU_server_12345678-319d-4a50-b27e-1234567890ab\u0060 and \u0060CPU_server_abcdef01-319d-4a50-b27e-abcdef012345\u0060 should be defined as metric \u0060CPU\u0060 and with a \u0060Server\u0060 dimension.","contentUrl":"https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-custom-overview#quotas-and-limits"},{"title":"Ingest custom metrics for an Azure resource using the REST API","content":"# Ingest custom metrics for an Azure resource using the REST API\n## Send REST requests to ingest custom metrics\nThe region property captures the Azure region where the resource you\u0027re emitting metrics for is deployed. Metrics must be emitted to the same Azure Monitor regional endpoint as the region where the resource is deployed. For example, custom metrics for a VM deployed in West US must be sent to the WestUS regional Azure Monitor endpoint. The region information is also encoded in the URL of the API call.\n### Timestamp\nEach data point sent to Azure Monitor must be marked with a timestamp. This timestamp captures the date and time at which the metric value is measured or collected. Azure Monitor accepts metric data with timestamps as far as 20 minutes in the past and 5 minutes in the future. The timestamp must be in ISO 8601 format.\n### Namespace\nNamespaces are a way to categorize or group similar metrics together. By using namespaces, you can achieve isolation between groups of metrics that might collect different insights or performance indicators. For example, you might have a namespace called **contosomemorymetrics** that tracks memory-use metrics which profile your app. Another namespace called **contosoapptransaction** might track all metrics about user transactions in your application.\n### Name\nThe name property is the name of the metric that\u0027s being reported. Usually, the name is descriptive enough to help identify what\u0027s measured. An example is a metric that measures the number of memory bytes used on a VM. It might have a metric name like **Memory Bytes In Use**.\n### Dimension keys\nA dimension is a key/value pair that helps describe other characteristics about the metric that\u0027s being collected. By using the other characteristics, you can collect more information about the metric, which allows for deeper insights.\nFor example, the **Memory Bytes In Use** metric might have a dimension key called **Process** that captures how many bytes of memory each process on a VM consumes. By using this key, you can filter the metric to see how much memory specific processes use or to identify the top five processes by memory usage.\nDimensions are optional, and not all metrics have dimensions. A custom metric can have up to 10 dimensions.\n### Dimension values\nWhen you\u0027re reporting a metric data point, for each dimension key on the reported metric, there\u0027s a corresponding dimension value. For example, you might want to report the memory that ContosoApp uses on your VM:\n1. The metric name would be **Memory Bytes in Use**.\n2. The dimension key would be **Process**.","contentUrl":"https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-store-custom-rest-api#send-rest-requests-to-ingest-custom-metrics"},{"title":"Ingest custom metrics for an Azure resource using the REST API","content":"# Ingest custom metrics for an Azure resource using the REST API\nThis article shows you how to send custom metrics for Azure resources to the Azure Monitor metrics store via the REST API. When the metrics are in Azure Monitor, you can do all the things with them that you do with standard metrics. For example, you can generate charts and alerts and route the metrics to other external tools.\nNote\nThe REST API only permits sending custom metrics for Azure resources. To send metrics for resources in other environments or on-premises, use [Application Insights](https://learn.microsoft.com/azure/azure-monitor/app/api-custom-events-metrics).","contentUrl":"https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-store-custom-rest-api"},{"title":"Custom metrics in Azure Monitor (preview)","content":"# Custom metrics in Azure Monitor (preview)\n## Latency and storage retention\nCustom metrics are retained for the [same amount of time as platform metrics](https://learn.microsoft.com/azure/azure-monitor/metrics/data-platform-metrics#retention-of-metrics).\nA newly added metric or a newly added dimension to a metric might take up to 3 minutes to appear. After the data is in the system, it should appear in less than 30 seconds 99 percent of the time.\nIf you delete a metric or remove a dimension, the change can take a week to a month to be deleted from the system.","contentUrl":"https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-custom-overview#latency-and-storage-retention"},{"title":"Ingest custom metrics for an Azure resource using the REST API","content":"# Ingest custom metrics for an Azure resource using the REST API\n## Send REST requests to ingest custom metrics\nWhen you send custom metrics to Azure Monitor, each data point, or value, reported in the metrics must include the following information.\n1. Authentication token\n2. Subject\n3. Region\n4. Timestamp\n5. Namespace\n6. Name\n7. Dimension keys\n8. Dimension values\n9. Metric values\n### Authentication\nTo submit custom metrics to Azure Monitor, the entity that submits the metric needs a valid Microsoft Entra token in the **Bearer** header of the request. Supported ways to acquire a valid bearer token include:\n1. [Managed identities for Azure resources](https://learn.microsoft.com/en-us/azure/active-directory/managed-identities-azure-resources/overview). You can use a managed identity to give resources permissions to carry out certain operations. An example is allowing a resource to emit metrics about itself. A resource, or its managed identity, can be granted **Monitoring Metrics Publisher** permissions on another resource. With this permission, the managed identity can also emit metrics for other resources.\n2. [Microsoft Entra service principal](https://learn.microsoft.com/en-us/azure/active-directory/develop/app-objects-and-service-principals). In this scenario, a Microsoft Entra application, or service, can be assigned permissions to emit metrics about an Azure resource. To authenticate the request, Azure Monitor validates the application token by using Microsoft Entra public keys. The existing **Monitoring Metrics Publisher** role already has this permission. It\u0027s available in the Azure portal.\n  The service principal, depending on what resources it emits custom metrics for, can be given the **Monitoring Metrics Publisher** role at the scope required. Examples are a subscription, resource group, or specific resource.\nTip\nWhen you request a Microsoft Entra token to emit custom metrics, ensure that the audience or resource that the token is requested for is \u0060https://monitoring.azure.com/\u0060. Be sure to include the trailing slash.\n### Get an authorization token\nOnce you have created your managed identity or service principal and assigned **Monitoring Metrics Publisher** permissions, you can get an authorization token. When requesting a token specify \u0060resource: https://monitoring.azure.com\u0060.\nGet an authentication token using any of the following methods:\n1. CLI\n2. REST API\n3. SDK","contentUrl":"https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-store-custom-rest-api#send-rest-requests-to-ingest-custom-metrics"}]}},"id":"cf93c1ef-e71d-41fe-8172-90f5d2570471","jsonrpc":"2.0"}

