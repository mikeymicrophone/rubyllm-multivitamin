        custom metrics for an Azure resource using the REST API\",\"content\":\"#
        Ingest custom metrics for an Azure resource using the REST API\\n## Send REST
        requests to ingest custom metrics\\nThe region property captures the Azure
        region where the resource you\\u0027re emitting metrics for is deployed. Metrics
        must be emitted to the same Azure Monitor regional endpoint as the region
        where the resource is deployed. For example, custom metrics for a VM deployed
        in West US must be sent to the WestUS regional Azure Monitor endpoint. The
        region information is also encoded in the URL of the API call.\\n### Timestamp\\nEach
        data point sent to Azure Monitor must be marked with a timestamp. This timestamp
        captures the date and time at which the metric value is measured or collected.
        Azure Monitor accepts metric data with timestamps as far as 20 minutes in
        the past and 5 minutes in the future. The timestamp must be in ISO 8601 format.\\n###
        Namespace\\nNamespaces are a way to categorize or group similar metrics together.
        By using namespaces, you can achieve isolation between groups of metrics that
        might collect different insights or performance indicators. For example, you
        might have a namespace called **contosomemorymetrics** that tracks memory-use
        metrics which profile your app. Another namespace called **contosoapptransaction**
        might track all metrics about user transactions in your application.\\n###
        Name\\nThe name property is the name of the metric that\\u0027s being reported.
        Usually, the name is descriptive enough to help identify what\\u0027s measured.
        An example is a metric that measures the number of memory bytes used on a
        VM. It might have a metric name like **Memory Bytes In Use**.\\n### Dimension
        keys\\nA dimension is a key/value pair that helps describe other characteristics
        about the metric that\\u0027s being collected. By using the other characteristics,
        you can collect more information about the metric, which allows for deeper
        insights.\\nFor example, the **Memory Bytes In Use** metric might have a dimension
        key called **Process** that captures how many bytes of memory each process
        on a VM consumes. By using this key, you can filter the metric to see how
        much memory specific processes use or to identify the top five processes by
        memory usage.\\nDimensions are optional, and not all metrics have dimensions.
        A custom metric can have up to 10 dimensions.\\n### Dimension values\\nWhen
        you\\u0027re reporting a metric data point, for each dimension key on the
        reported metric, there\\u0027s a corresponding dimension value. For example,
        you might want to report the memory that ContosoApp uses on your VM:\\n1.
        The metric name would be **Memory Bytes in Use**.\\n2. The dimension key would
        be **Process**.\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-store-custom-rest-api#send-rest-requests-to-ingest-custom-metrics\"},{\"title\":\"Ingest
        custom metrics for an Azure resource using the REST API\",\"content\":\"#
        Ingest custom metrics for an Azure resource using the REST API\\nThis article
        shows you how to send custom metrics for Azure resources to the Azure Monitor
        metrics store via the REST API. When the metrics are in Azure Monitor, you
        can do all the things with them that you do with standard metrics. For example,
        you can generate charts and alerts and route the metrics to other external
        tools.\\nNote\\nThe REST API only permits sending custom metrics for Azure
        resources. To send metrics for resources in other environments or on-premises,
        use [Application Insights](https://learn.microsoft.com/azure/azure-monitor/app/api-custom-events-metrics).\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-store-custom-rest-api\"},{\"title\":\"Custom
        metrics in Azure Monitor (preview)\",\"content\":\"# Custom metrics in Azure
        Monitor (preview)\\n## Latency and storage retention\\nCustom metrics are
        retained for the [same amount of time as platform metrics](https://learn.microsoft.com/azure/azure-monitor/metrics/data-platform-metrics#retention-of-metrics).\\nA
        newly added metric or a newly added dimension to a metric might take up to
        3 minutes to appear. After the data is in the system, it should appear in
        less than 30 seconds 99 percent of the time.\\nIf you delete a metric or remove
        a dimension, the change can take a week to a month to be deleted from the
        system.\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-custom-overview#latency-and-storage-retention\"},{\"title\":\"Ingest
        custom metrics for an Azure resource using the REST API\",\"content\":\"#
        Ingest custom metrics for an Azure resource using the REST API\\n## Send REST
        requests to ingest custom metrics\\nWhen you send custom metrics to Azure
        Monitor, each data point, or value, reported in the metrics must include the
        following information.\\n1. Authentication token\\n2. Subject\\n3. Region\\n4.
        Timestamp\\n5. Namespace\\n6. Name\\n7. Dimension keys\\n8. Dimension values\\n9.
        Metric values\\n### Authentication\\nTo submit custom metrics to Azure Monitor,
        the entity that submits the metric needs a valid Microsoft Entra token in
        the **Bearer** header of the request. Supported ways to acquire a valid bearer
        token include:\\n1. [Managed identities for Azure resources](https://learn.microsoft.com/en-us/azure/active-directory/managed-identities-azure-resources/overview).
        You can use a managed identity to give resources permissions to carry out
        certain operations. An example is allowing a resource to emit metrics about
        itself. A resource, or its managed identity, can be granted **Monitoring Metrics
        Publisher** permissions on another resource. With this permission, the managed
        identity can also emit metrics for other resources.\\n2. [Microsoft Entra
        service principal](https://learn.microsoft.com/en-us/azure/active-directory/develop/app-objects-and-service-principals).
        In this scenario, a Microsoft Entra application, or service, can be assigned
        permissions to emit metrics about an Azure resource. To authenticate the request,
        Azure Monitor validates the application token by using Microsoft Entra public
        keys. The existing **Monitoring Metrics Publisher** role already has this
        permission. It\\u0027s available in the Azure portal.\\n  The service principal,
        depending on what resources it emits custom metrics for, can be given the
        **Monitoring Metrics Publisher** role at the scope required. Examples are
        a subscription, resource group, or specific resource.\\nTip\\nWhen you request
        a Microsoft Entra token to emit custom metrics, ensure that the audience or
        resource that the token is requested for is \\u0060https://monitoring.azure.com/\\u0060.
        Be sure to include the trailing slash.\\n### Get an authorization token\\nOnce
        you have created your managed identity or service principal and assigned **Monitoring
        Metrics Publisher** permissions, you can get an authorization token. When
        requesting a token specify \\u0060resource: https://monitoring.azure.com\\u0060.\\nGet
        an authentication token using any of the following methods:\\n1. CLI\\n2.
        REST API\\n3. SDK\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-monitor/metrics/metrics-store-custom-rest-api#send-rest-requests-to-ingest-custom-metrics\"}]}"}],"instructions":"You
