        data: {"result":{"tools":[{"name":"microsoft_docs_search","title":"Microsoft Docs Search","description":"Search official Microsoft/Azure documentation to find the most relevant and trustworthy content for a user\u0027s query. This tool returns up to 10 high-quality content chunks (each max 500 tokens), extracted from Microsoft Learn and other official sources. Each result includes the article title, URL, and a self-contained content excerpt optimized for fast retrieval and reasoning. Always use this tool to quickly ground your answers in accurate, first-party Microsoft/Azure knowledge.\n\n## Follow-up Pattern\nTo ensure completeness, use microsoft_docs_fetch when high-value pages are identified by search. The fetch tool complements search by providing the full detail. This is a required step for comprehensive results.","inputSchema":{"type":"object","properties":{"query":{"description":"a query or topic about Microsoft/Azure products, services, platforms, developer tools, frameworks, or APIs","type":"string","default":null}}},"outputSchema":{"type":"object","properties":{"results":{"type":"array","items":{"type":"object","properties":{"id":{"type":["string","null"]},"title":{"type":"string"},"content":{"type":["string","null"]},"contentUrl":{"type":"string"},"content_omitted":{"type":"boolean"},"extensionData":{"type":["object","null"]}}}}}},"annotations":{"title":"Microsoft Docs Search","destructiveHint":false,"idempotentHint":true,"readOnlyHint":true}},{"name":"microsoft_code_sample_search","title":"Microsoft Code Sample Search","description":"Search for code snippets and examples in official Microsoft Learn documentation. This tool retrieves relevant code samples from Microsoft documentation pages providing developers with practical implementation examples and best practices for Microsoft/Azure products and services related coding tasks. This tool will help you use the **LATEST OFFICIAL** code snippets to empower coding capabilities.\n\n## When to Use This Tool\n- When you are going to provide sample Microsoft/Azure related code snippets in your answers.\n- When you are **generating any Microsoft/Azure related code**.\n\n## Usage Pattern\nInput a descriptive query, or SDK/class/method name to retrieve related code samples. The optional parameter \u0060language\u0060 can help to filter results.\n\nEligible values for \u0060language\u0060 parameter include: csharp javascript typescript python powershell azurecli al sql java kusto cpp go rust ruby php","inputSchema":{"type":"object","properties":{"query":{"description":"a descriptive query, SDK name, method name or code snippet related to Microsoft/Azure products, services, platforms, developer tools, frameworks, APIs or SDKs","type":"string"},"language":{"description":"Optional parameter specifying the programming language of code snippets to retrieve. Can significantly improve search quality if provided. Eligible values: csharp javascript typescript python powershell azurecli al sql java kusto cpp go rust ruby php","type":"string","default":null}},"required":["query"]},"outputSchema":{"type":"object","properties":{"results":{"type":"array","items":{"type":"object","properties":{"description":{"type":"string"},"codeSnippet":{"type":["string","null"]},"link":{"type":"string"},"language":{"type":"string"},"content_omitted":{"type":"boolean"}}}}}},"annotations":{"title":"Microsoft Code Sample Search","destructiveHint":false,"idempotentHint":true,"readOnlyHint":true}},{"name":"microsoft_docs_fetch","title":"Microsoft Docs Fetch","description":"Fetch and convert a Microsoft Learn documentation webpage to markdown format. This tool retrieves the latest complete content of Microsoft documentation webpages including Azure, .NET, Microsoft 365, and other Microsoft technologies.\n\n## When to Use This Tool\n- When search results provide incomplete information or truncated content\n- When you need complete step-by-step procedures or tutorials\n- When you need troubleshooting sections, prerequisites, or detailed explanations\n- When search results reference a specific page that seems highly relevant\n- For comprehensive guides that require full context\n\n## Usage Pattern\nUse this tool AFTER microsoft_docs_search when you identify specific high-value pages that need complete content. The search tool gives you an overview; this tool gives you the complete picture.\n\n## URL Requirements\n- The URL must be a valid HTML documentation webpage from the microsoft.com domain\n- Binary files (PDF, DOCX, images, etc.) are not supported\n\n## Output Format\nmarkdown with headings, code blocks, tables, and links preserved.","inputSchema":{"type":"object","properties":{"url":{"description":"URL of the Microsoft documentation page to read","type":"string"}},"required":["url"]},"annotations":{"title":"Microsoft Docs Fetch","destructiveHint":false,"idempotentHint":true,"readOnlyHint":true}}]},"id":"cf6468a9-16dd-491c-9387-9b2d1ac897c7","jsonrpc":"2.0"}

